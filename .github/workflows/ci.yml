name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-schema:
    name: validate examples against schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install check-jsonschema
        run: pip install 'check-jsonschema==0.38.0'
      - name: Validate ansible_inventory example against schema
        run: check-jsonschema --schemafile schemas/ansible-inventory-v1.json examples/ansible_inventory.json
      - name: Validate nautobot_export example against schema
        run: check-jsonschema --schemafile schemas/nautobot-export-v1.json examples/nautobot_export.json

  shape-snapshot-gate:
    name: enforce snapshot on shape change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Diff schemas/ against latest versions/
        run: bash .github/scripts/diff-against-latest-version.sh

  lint-shell:
    name: shellcheck bin/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: shellcheck
        run: shellcheck bin/flow-lock bin/deployment-json

  test-cli:
    name: bats CLI-contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install bats
        run: sudo apt-get update -q && sudo apt-get install -y -q bats
      - name: Run bats
        run: bats tests/flow-lock.bats

  lint-ansible-role:
    name: ansible-lint inventory_resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install ansible-lint
        run: pip install 'ansible-lint==25.*' 'ansible-core==2.18.*' boto3 botocore
      - name: Install required collections
        run: ansible-galaxy collection install amazon.aws community.hashi_vault
      - name: Lint the shared roles
        run: ansible-lint ansible/roles/inventory_resolve ansible/roles/docker_engine ansible/roles/ntp ansible/roles/ssh_ca_trust ansible/roles/syslog_forwarder ansible/roles/systemd_restart_policy ansible/roles/service_deadman ansible/roles/openbao_secrets ansible/roles/converge_gate ansible/playbooks/converge_gate.yml
      # Runs here because this job already has ansible-core and the collections
      # the role needs. The check it pins is the apply-owed detector's fail-open
      # contract: without object-store credentials it must skip rather than
      # report the artifact current, since a detector that passes when it never
      # ran hides exactly the drift it exists to surface.
      - name: Verify the apply-owed check fails open (no credentials)
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
        run: ansible-playbook -i localhost, tests/inventory_resolve/apply_owed_fail_open.yml
      # Same contract, inner path: credentials present but the live read
      # itself fails. Needs boto3/botocore (installed above) since this one
      # actually invokes amazon.aws.s3_object_info rather than skipping before it.
      - name: Verify the apply-owed check fails open (live read fails)
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
        run: ansible-playbook -i localhost, tests/inventory_resolve/apply_owed_read_failure.yml
      # converge_gate contract: the cap this role enforces must always sit
      # strictly below whatever ceiling fed it (the Semaphore-forwarded env
      # var, or the one fallback default), and a CONVERGE_WALL_CLOCK_CAP
      # override on main must never widen past that -- a cap that reaches
      # the ceiling lets Semaphore's own kill fire first, with no PLAY RECAP
      # and no rerun hint.
      - name: Verify the wall-clock cap derives from the Semaphore-forwarded ceiling
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
          SEMAPHORE_MAX_TASK_DURATION_SEC: "900"
        run: ansible-playbook -i localhost, tests/converge_gate/cap_from_semaphore_env.yml
      - name: Verify the wall-clock cap falls back to the one default var
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
        run: ansible-playbook -i localhost, tests/converge_gate/cap_fallback_default.yml
      - name: Verify a CONVERGE_WALL_CLOCK_CAP override on main is clamped
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
          SEMAPHORE_MAX_TASK_DURATION_SEC: "900"
          CONVERGE_WALL_CLOCK_CAP: "5000"
        run: ansible-playbook -i localhost, tests/converge_gate/cap_clamped_on_main.yml

  test-converge-telemetry:
    name: pytest converge_telemetry callback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install ansible-core and pytest
        run: pip install 'ansible-core==2.18.*' pytest
      - name: Run the callback's test suite
        working-directory: tests
        run: >-
          python -m pytest test_converge_telemetry.py
          test_converge_telemetry_events.py
          test_converge_telemetry_interrupt.py -q
