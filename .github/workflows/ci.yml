name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-schema:
    name: validate examples against schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install check-jsonschema
        run: pip install 'check-jsonschema==0.37.2'
      - name: Validate ansible_inventory example against schema
        run: check-jsonschema --schemafile schemas/ansible-inventory-v1.json examples/ansible_inventory.json
      - name: Validate nautobot_export example against schema
        run: check-jsonschema --schemafile schemas/nautobot-export-v1.json examples/nautobot_export.json

  shape-snapshot-gate:
    name: enforce snapshot on shape change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Diff schemas/ against latest versions/
        run: bash .github/scripts/diff-against-latest-version.sh

  lint-shell:
    name: shellcheck bin/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: shellcheck
        run: shellcheck bin/flow-lock bin/deployment-json

  test-cli:
    name: bats CLI-contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install bats
        run: sudo apt-get update -q && sudo apt-get install -y -q bats
      - name: Run bats
        run: bats tests/flow-lock.bats

  lint-ansible-role:
    name: ansible-lint inventory_resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install ansible-lint
        run: pip install 'ansible-lint==25.*' 'ansible-core==2.18.*' boto3 botocore
      - name: Install required collections
        run: ansible-galaxy collection install amazon.aws community.hashi_vault
      - name: Lint the shared role
        run: ansible-lint ansible/roles/inventory_resolve

      # Runs here because this job already has ansible-core and the collections
      # the role needs. The check it pins is the apply-owed detector's fail-open
      # contract: without object-store credentials it must skip rather than
      # report the artifact current, since a detector that passes when it never
      # ran hides exactly the drift it exists to surface.
      - name: Verify the apply-owed check fails open (no credentials)
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
        run: ansible-playbook -i localhost, tests/inventory_resolve/apply_owed_fail_open.yml

      # Same contract, inner path: credentials present but the live read
      # itself fails. Needs boto3/botocore (installed above) since this one
      # actually invokes amazon.aws.s3_object_info rather than skipping before it.
      - name: Verify the apply-owed check fails open (live read fails)
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
        run: ansible-playbook -i localhost, tests/inventory_resolve/apply_owed_read_failure.yml
