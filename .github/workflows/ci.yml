name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-schema:
    name: validate examples against schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.15"
      - name: Install check-jsonschema
        run: pip install 'check-jsonschema==0.38.2'
      - name: Validate ansible_inventory example against schema
        run: check-jsonschema --schemafile schemas/ansible-inventory-v1.json examples/ansible_inventory.json
      - name: Validate ownership fixtures, including a local router key class
        run: >-
          check-jsonschema --schemafile schemas/ansible-inventory-v1.json
          tests/inventory_agent_ownership/fixtures/valid.json
          tests/inventory_agent_ownership/fixtures/duplicate-owner.json
          tests/inventory_agent_ownership/fixtures/duplicate-specialization.json
          tests/inventory_agent_ownership/fixtures/logical-owners.json
          tests/inventory_agent_ownership/fixtures/duplicate-mixed-owner.json
      - name: Reject incomplete logical owner and physical identity shapes
        run: |
          jq '.agents["github-repository-specialist"].specializations = []' \
            tests/inventory_agent_ownership/fixtures/logical-owners.json > "$RUNNER_TEMP/logical-empty-specializations.json"
          check-jsonschema --schemafile schemas/ansible-inventory-v1.json "$RUNNER_TEMP/logical-empty-specializations.json"
          jq 'del(.agents["github-repository-specialist"].specializations)' \
            tests/inventory_agent_ownership/fixtures/logical-owners.json > "$RUNNER_TEMP/logical-missing-specializations.json"
          if check-jsonschema --schemafile schemas/ansible-inventory-v1.json "$RUNNER_TEMP/logical-missing-specializations.json"; then
            echo "Logical owner without specializations unexpectedly validated" >&2
            exit 1
          fi
          jq 'del(.agents["github-repository-specialist"].native_binding_ref)' \
            tests/inventory_agent_ownership/fixtures/logical-owners.json > "$RUNNER_TEMP/logical-missing-binding.json"
          if check-jsonschema --schemafile schemas/ansible-inventory-v1.json "$RUNNER_TEMP/logical-missing-binding.json"; then
            echo "Logical owner without native_binding_ref unexpectedly validated" >&2
            exit 1
          fi
          jq 'del(.agents["github-repository-specialist"].trust_tier)' \
            tests/inventory_agent_ownership/fixtures/logical-owners.json > "$RUNNER_TEMP/logical-missing-trust-tier.json"
          if check-jsonschema --schemafile schemas/ansible-inventory-v1.json "$RUNNER_TEMP/logical-missing-trust-tier.json"; then
            echo "Logical owner without trust_tier unexpectedly validated" >&2
            exit 1
          fi
          jq '.agents["github-repository-specialist"].native_binding_ref = "   "' \
            tests/inventory_agent_ownership/fixtures/logical-owners.json > "$RUNNER_TEMP/logical-blank-binding.json"
          if check-jsonschema --schemafile schemas/ansible-inventory-v1.json "$RUNNER_TEMP/logical-blank-binding.json"; then
            echo "Logical owner with a blank native_binding_ref unexpectedly validated" >&2
            exit 1
          fi
          jq '.agents["github-repository-specialist"].container = "fixture-container"' \
            tests/inventory_agent_ownership/fixtures/logical-owners.json > "$RUNNER_TEMP/partial-physical-identity.json"
          if check-jsonschema --schemafile schemas/ansible-inventory-v1.json "$RUNNER_TEMP/partial-physical-identity.json"; then
            echo "Agent with only one physical identity field unexpectedly validated" >&2
            exit 1
          fi
      - name: Reject unknown logical owner router key class
        run: |
          jq '.agents["github-repository-specialist"].router_key_class = "unknown"' \
            tests/inventory_agent_ownership/fixtures/logical-owners.json > "$RUNNER_TEMP/unknown-router-key-class.json"
          if check-jsonschema --schemafile schemas/ansible-inventory-v1.json "$RUNNER_TEMP/unknown-router-key-class.json"; then
            echo "Unknown router_key_class unexpectedly validated" >&2
            exit 1
          fi
      - name: Accept a public logical owner router key class
        run: |
          jq '.agents["github-repository-specialist"].router_key_class = "public"' \
            tests/inventory_agent_ownership/fixtures/logical-owners.json > "$RUNNER_TEMP/public-router-key-class.json"
          check-jsonschema --schemafile schemas/ansible-inventory-v1.json "$RUNNER_TEMP/public-router-key-class.json"
      - name: Validate optional Hindsight service state and prior schema compatibility
        run: |
          jq '.constants.service_state.hindsight_enabled = false' examples/ansible_inventory.json > "$RUNNER_TEMP/hindsight-disabled.json"
          jq '.constants.service_state.hindsight_enabled = true' examples/ansible_inventory.json > "$RUNNER_TEMP/hindsight-enabled.json"
          jq '.constants.service_state.hindsight_enabled = "false"' examples/ansible_inventory.json > "$RUNNER_TEMP/hindsight-invalid.json"
          check-jsonschema --schemafile schemas/ansible-inventory-v1.json "$RUNNER_TEMP/hindsight-disabled.json" "$RUNNER_TEMP/hindsight-enabled.json"
          check-jsonschema --schemafile versions/v5.19.0/ansible-inventory.json "$RUNNER_TEMP/hindsight-disabled.json" "$RUNNER_TEMP/hindsight-enabled.json"
          if check-jsonschema --schemafile schemas/ansible-inventory-v1.json "$RUNNER_TEMP/hindsight-invalid.json"; then
            echo "String service state unexpectedly validated" >&2
            exit 1
          fi
      - name: Validate nautobot_export example against schema
        run: check-jsonschema --schemafile schemas/nautobot-export-v1.json examples/nautobot_export.json
      - name: Validate the llm_roles model map against its schema
        run: check-jsonschema --schemafile schemas/model-roles-v1.json ansible/roles/llm_roles/files/model-roles.json
      - name: Validate the llm_roles lane vocabulary against its schema
        run: check-jsonschema --schemafile schemas/lanes-v1.json ansible/roles/llm_roles/files/lanes.json
      - name: Validate the agent_callers registry against its schema
        run: check-jsonschema --schemafile schemas/callers-v1.json ansible/roles/agent_callers/files/callers.json
      - name: Negative - a dense model with concurrency above 1 must fail the schema
        run: |
          if check-jsonschema --schemafile schemas/model-roles-v1.json tests/llm_roles/bad-dense-concurrency.json; then
            echo "bad-dense-concurrency.json unexpectedly validated" >&2
            exit 1
          fi
      - name: Negative - the unknown-model fixture is schema-valid (rejected by the role contract test instead)
        run: check-jsonschema --schemafile schemas/model-roles-v1.json tests/llm_roles/bad-unknown-model.json

  shape-snapshot-gate:
    name: enforce snapshot on shape change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Diff schemas/ against latest versions/
        run: bash .github/scripts/diff-against-latest-version.sh

  lint-shell:
    name: shellcheck bin/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: shellcheck
        run: shellcheck bin/bao-approle bin/flow-lock bin/deployment-json scripts/semaphore-run scripts/run-ansible

  test-cli:
    name: bats CLI-contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install bats
        run: sudo apt-get update -q && sudo apt-get install -y -q bats
      - name: Run bats
        run: bats tests/bao-approle.bats tests/flow-lock.bats tests/semaphore-run.bats tests/run-ansible.bats

  lint-ansible-role:
    name: ansible-lint inventory_resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install ansible-lint
        run: pip install 'ansible-lint==25.*' 'ansible-core==2.18.*' boto3 botocore hvac
      - name: Install required collections
        run: ansible-galaxy collection install amazon.aws community.hashi_vault community.general
      - name: Converge bao_approle_cli in a Debian container
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --workdir /workspace \
            python:3.13-slim \
            bash -euc '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends curl jq
              python -m pip install --no-cache-dir "ansible-core==2.18.*"
              ANSIBLE_ROLES_PATH=/workspace/ansible/roles \
                ansible-playbook -i localhost, tests/bao_approle_cli/test_container.yml
            '
      - name: Lint the shared roles
        run: bash .github/scripts/lint-shared-roles.sh
      # Runs here because this job already has ansible-core and the collections
      # the role needs. The check it pins is the apply-owed detector's fail-open
      # contract: without object-store credentials it must skip rather than
      # report the artifact current, since a detector that passes when it never
      # ran hides exactly the drift it exists to surface.
      - name: Verify the apply-owed check fails open (no credentials)
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
        run: ansible-playbook -i localhost, tests/inventory_resolve/apply_owed_fail_open.yml
      # Same contract, inner path: credentials present but the live read
      # itself fails. Needs boto3/botocore (installed above) since this one
      # actually invokes amazon.aws.s3_object_info rather than skipping before it.
      - name: Verify the apply-owed check fails open (live read fails)
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
        run: ansible-playbook -i localhost, tests/inventory_resolve/apply_owed_read_failure.yml

      - name: Verify the llm_model_catalog contract
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
        run: ansible-playbook -i localhost, tests/llm_model_catalog/test_contract.yml
      - name: Verify the llm_router_key_catalog contract
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
        run: ansible-playbook -i localhost, tests/llm_router_key_catalog/test_contract.yml
      - name: Verify the llm_roles contract
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
        run: ansible-playbook -i localhost, tests/llm_roles/test_contract.yml
      - name: Verify the agent_callers contract
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
        run: ansible-playbook -i localhost, tests/agent_callers/test_contract.yml
      # converge_gate contract: the cap this role enforces must always sit
      # strictly below whatever ceiling fed it (the Semaphore-forwarded env
      # var, or the one fallback default), and a CONVERGE_WALL_CLOCK_CAP
      # override on main must never widen past that -- a cap that reaches
      # the ceiling lets Semaphore's own kill fire first, with no PLAY RECAP
      # and no rerun hint.
      - name: Verify store inputs resolve SECRET_STORE_* first, then the older names
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
          SECRET_STORE_MONITORING_ROLE_ID: generic-role
          SECRET_STORE_MONITORING_SECRET_ID: generic-secret
          OPENBAO_APPROLE_MONITORING_ROLE_ID: new-mon-role
          OPENBAO_APPROLE_MONITORING_SECRET_ID: new-mon-secret
          SECRET_STORE_ADDR: https://generic.test
          BAO_ADDR: https://legacy.test
          OPENBAO_APPROLE_ANSIBLE_ROLE_ID: legacy-publish-role
          OPENBAO_APPROLE_ANSIBLE_SECRET_ID: legacy-publish-secret
          OPENBAO_APPROLE_LOCAL_CLOUD_ROLE_ID: new-role
          OPENBAO_APPROLE_LOCAL_CLOUD_SECRET_ID: new-secret
          LOCAL_CLOUD_VAULT_ROLE_ID: legacy-role
          LOCAL_CLOUD_VAULT_SECRET_ID: legacy-secret
          APPS_VAULT_ROLE_ID: legacy-apps-role
          APPS_VAULT_SECRET_ID: legacy-apps-secret
        run: ansible-playbook -i localhost, tests/openbao_secrets/resolve_approle.yml
      - name: Verify seed_generated create, merge, rotate, provided-value and guard behaviour
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
        run: ansible-playbook -i localhost, tests/openbao_secrets/seed_generated.yml
      - name: Verify credential publishing skips KV writes in check mode
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
        run: ansible-playbook --check -i localhost, tests/openbao_secrets/publish_check.yml
      - name: Verify credential publishing merges under check-and-set and refuses a failed read
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
        run: ansible-playbook -i localhost, tests/openbao_secrets/publish_merge.yml
      - name: Verify the openbao_secrets read path (domain switches, login paths, read classification)
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
          FAKE_READER_ROLE_ID: reader
          FAKE_READER_SECRET_ID: reader-secret
          FAKE_CIDR_ROLE_ID: cidr
          FAKE_CIDR_SECRET_ID: cidr-secret
          FAKE_REFUSED_ROLE_ID: refused
          FAKE_REFUSED_SECRET_ID: refused-secret
          OPENBAO_APPROLE_APPROLE_ISSUER_ROLE_ID: issuer-role
          OPENBAO_APPROLE_APPROLE_ISSUER_SECRET_ID: issuer-secret
        # The flow-lock stand-in comes first on PATH, so the issuer path runs without the real CLI.
        run: PATH="$PWD/tests/openbao_secrets/stub-bin:$PATH" ansible-playbook -i localhost, tests/openbao_secrets/read_path.yml
      - name: Verify langfuse_project_keys planning, refusals, reuse and the single write
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
        run: ansible-playbook -i localhost, tests/langfuse_project_keys/provision.yml
      - name: Verify the wall-clock cap derives from the Semaphore-forwarded ceiling
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
          SEMAPHORE_MAX_TASK_DURATION_SEC: "900"
        run: ansible-playbook -i localhost, tests/converge_gate/cap_from_semaphore_env.yml
      - name: Verify the wall-clock cap falls back to the one default var
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
        run: ansible-playbook -i localhost, tests/converge_gate/cap_fallback_default.yml
      - name: Verify a CONVERGE_WALL_CLOCK_CAP override on main is clamped
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
          SEMAPHORE_MAX_TASK_DURATION_SEC: "900"
          CONVERGE_WALL_CLOCK_CAP: "5000"
        run: ansible-playbook -i localhost, tests/converge_gate/cap_clamped_on_main.yml
      # Same contract for the other half of the gate: failed-host detection
      # reads hostvars via one dict2items/selectattr expression instead of a
      # per-item loop, and must match the old loop's semantics exactly -- a
      # host only counts if its failure fact is both defined and non-empty.
      - name: Verify failed-host detection matches the old loop's non-empty-list-only semantics
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
        run: ansible-playbook -i localhost, tests/converge_gate/failed_hosts_from_hostvars.yml

      - name: Verify the cribl_edge node_exporter hardware-sensor source renders only when enabled
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
        run: ansible-playbook -i localhost, tests/cribl_edge/node_exporter_scrape.yml

      - name: Verify the cribl_edge syslog pipeline parses Proxmox task UPIDs
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
        run: ansible-playbook -i localhost, tests/cribl_edge/pve_task_logs.yml

      - name: Verify the cribl_edge role applies its own restart before the play can end the host
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
        run: ansible-playbook -i localhost, tests/cribl_edge/handlers_flushed.yml

  test-converge-telemetry:
    name: pytest converge_telemetry callback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.15"
      - name: Install ansible-core and pytest
        run: pip install 'ansible-core==2.18.*' pytest
      - name: Run the callback's test suite
        working-directory: tests
        run: >-
          python -m pytest test_converge_telemetry.py
          test_converge_telemetry_events.py
          test_converge_telemetry_interrupt.py -q
