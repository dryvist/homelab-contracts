# CI Gate — thin wrapper over the dryvist org reusable workflow
#
# Delegates the standard checks to the org orchestrator
# `JacobPEvans/.github/.github/workflows/_ci-gate.yml@v1`; its `Merge Gate`
# summary job always reports, making it safe to require in rulesets.

name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Job id `gate` is the org-canonical caller shape: the required status
  # check context is `gate / Merge Gate` on every consumer.
  gate:
    permissions:
      contents: read
      pull-requests: read
      # The org gate's queue watchdog cancels stuck sibling jobs via the
      # Actions API; a called workflow can never exceed the caller's grant,
      # so `actions: write` must be granted here or the run fails at graph
      # validation (startup_failure).
      actions: write
    uses: JacobPEvans/.github/.github/workflows/_ci-gate.yml@v1
    with:
      profile: ansible
      # Keep the two contract checks in the shared Merge Gate's repo-tests job.
      test_command: |
        set -euo pipefail
        python3 -m venv "$RUNNER_TEMP/contracts-gate"
        "$RUNNER_TEMP/contracts-gate/bin/python" -m pip install 'ansible-core==2.18.*'
        bash .github/scripts/diff-against-latest-version.sh
        python3 .github/scripts/lane-alias-parity.py \
          --lanes ansible/roles/llm_roles/files/lanes.json \
          --names tests/lane_alias_parity/fixtures/pass.json
        if python3 .github/scripts/lane-alias-parity.py \
          --lanes ansible/roles/llm_roles/files/lanes.json \
          --names tests/lane_alias_parity/fixtures/fail.json; then
          echo "expected fail fixture to report an unknown lane-class name" >&2
          exit 1
        else
          fixture_status=$?
          [[ "$fixture_status" -eq 1 ]] || exit "$fixture_status"
        fi
        python3 -c 'import json; from pathlib import Path; roles=json.loads(Path("ansible/roles/llm_roles/files/model-roles.json").read_text())["roles"]; print(json.dumps({"source":"homelab-contracts non-Stage-0 role keys","names":sorted(name for name in roles if not name.startswith("stage0_"))}))' \
          > "$RUNNER_TEMP/lane-alias-contracts.json"
        python3 .github/scripts/lane-alias-parity.py \
          --lanes ansible/roles/llm_roles/files/lanes.json \
          --names "$RUNNER_TEMP/lane-alias-contracts.json"
        for contract in llm_model_catalog llm_router_key_catalog llm_roles agent_callers; do
          ANSIBLE_ROLES_PATH=ansible/roles "$RUNNER_TEMP/contracts-gate/bin/ansible-playbook" -i localhost, "tests/$contract/test_contract.yml"
        done
