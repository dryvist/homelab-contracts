    # renovate-digest: datasource=git-refs depName=nomic-embed-text-v1.5 packageName=https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF
    hf_revision: 0188c9bf409793f810680a5a431e7b899c46104c

  - name: qwen3.5-9b
