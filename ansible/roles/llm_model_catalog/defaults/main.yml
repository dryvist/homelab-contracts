  # Embedder + reranker pair (served on both the vllm-tier GPU host and the
  # cpu-9b pool as a failover rung — both must serve the byte-identical GGUF,
  # since a consumer's stored embedding dimension is locked to whichever one
  # answered first). Same catalog entry backs both call sites.
  - name: bge-m3
    context_window: 8192
    stream_timeout: 15
    hf_repo: gpustack/bge-m3-GGUF
    gguf: bge-m3-Q8_0.gguf
    # renovate-digest: datasource=git-refs depName=bge-m3 packageName=https://huggingface.co/gpustack/bge-m3-GGUF
    hf_revision: 2d48f1737679ad900d5c26c5aad5410e9c70fdca

  - name: bge-reranker-v2-m3
