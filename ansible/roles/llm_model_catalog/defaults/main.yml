    # renovate-digest: datasource=git-refs depName=bge-reranker-v2-m3 packageName=https://huggingface.co/gpustack/bge-reranker-v2-m3-GGUF
    hf_revision: 3093af03b1a635e67b084b1d8c03c5f5e020fd05

