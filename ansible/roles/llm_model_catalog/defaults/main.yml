---
# llm_model_catalog role defaults — the ONE list of model profiles on the
# llm fabric. No tasks: including this role in a play makes
# `llm_model_catalog_models` available to every role that runs after it in
# the same play (Ansible role defaults persist for the rest of the play).
#
# Consumers: dryvist/ansible-proxmox (llm_model_store_seed downloads only
# entries with GGUF artifact fields) and dryvist/ansible-proxmox-ai (router,
# serving roles, Hermes presets, and guards). Numeric limits are keyed by the
# same model entry and projected by consumers; entries without GGUF artifact
# fields represent provider-hosted models.
#
# Each entry:
#   name:        canonical model id; router aliases may use catalog_model to
#                refer to this entry
#   context_window / max_output_tokens / max_parallel_requests / timeout and
#                cost fields: model-specific values projected by consumers
#   hf_repo:     optional HuggingFace repo holding a GGUF, "<owner>/<repo>"
#   gguf:        optional filename of the GGUF asset within that repo
#   hf_revision: optional exact commit used for the download and sha256 read.
#                A HuggingFace model repo is a plain git repository, so this
#                is tracked by Renovate's native git-refs datasource against
#                https://huggingface.co/<hf_repo> — no custom datasource
#                needed. The `# renovate-digest:` annotation immediately
#                above each hf_revision drives that; it uses its own prefix,
#                not this estate's shared `# renovate: datasource=...
#                depName=...` convention (dryvist/.github's
#                renovate-presets.json), because that shared manager's regex
#                has no packageName capture group and would otherwise also
#                match these lines, trying to resolve git-refs against a
#                packageName of just the short model name.
#
# The three HF artifact fields are all-or-none. No sha256/checksum field here
# on purpose: the sha256 is derived from
# HuggingFace's own LFS blob metadata at run time (the consuming role's job),
# never stored as a second, driftable copy of a value HuggingFace already
# publishes.
llm_model_catalog_models:
  - name: qwen3-4b
    context_window: 8192
    hf_repo: bartowski/Qwen_Qwen3-4B-Instruct-2507-GGUF
    gguf: Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf
    # renovate-digest: datasource=git-refs depName=qwen3-4b packageName=https://huggingface.co/bartowski/Qwen_Qwen3-4B-Instruct-2507-GGUF
    hf_revision: ae44f08e1392f39c0e474af10c3ff8355c8b6688

  - name: nomic-embed-text-v1.5
    context_window: 8192
    hf_repo: nomic-ai/nomic-embed-text-v1.5-GGUF
