---
- name: Load shared Cribl catalog
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../cribl_edge/files/cribl.json"
    name: cribl_catalog

# Resolve pack target and per-target paths from inventory group membership.
- name: Determine pack target
  ansible.builtin.set_fact:
    cribl_packs_target: >-
      {{
        'edge' if 'cribl_edge' in group_names
        else ('stream' if 'cribl_stream_group' in group_names else '')
      }}

- name: Skip hosts that are neither Cribl Edge nor Cribl Stream
  ansible.builtin.meta: end_host
  when: cribl_packs_target == ''

- name: Set per-target Cribl paths
  ansible.builtin.set_fact:
    _cribl_packs_pack_root: >-
      {{
        cribl_packs_edge_config_root ~ '/packs' if cribl_packs_target == 'edge'
        else cribl_packs_stream_pack_root
      }}
    _cribl_packs_names: >-
      {{
        cribl_packs_for_edge if cribl_packs_target == 'edge'
        else cribl_packs_for_stream
      }}
    _cribl_packs_list: []

- name: Read the mirrored Cribl pack manifest
  ansible.builtin.uri:
    url: "{{ cribl_packs_object_storage_base_url }}/manifest.json"
    return_content: true
    status_code: 200
  register: cribl_packs_manifest_response
  # uri has no check mode; this read changes nothing, so --check runs it.
  check_mode: false
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  when: cribl_packs_object_storage_base_url is defined

- name: Load mirrored Cribl pack manifest
  ansible.builtin.set_fact:
    _cribl_packs_manifest: "{{ cribl_packs_manifest_response.content | from_json }}"
  when: cribl_packs_object_storage_base_url is defined

- name: Validate catalog packs in the mirrored manifest
  ansible.builtin.assert:
    that:
      - item in _cribl_packs_manifest
      - _cribl_packs_manifest[item].version | length > 0
      - _cribl_packs_manifest[item].sha256 | length == 64
  loop: "{{ _cribl_packs_names }}"
  loop_control:
    label: "{{ item }}"
  when: cribl_packs_object_storage_base_url is defined

- name: Resolve Cribl packs from the mirrored manifest
  ansible.builtin.set_fact:
    _cribl_packs_list: >-
      {{ _cribl_packs_list + [
        {
          'name': item,
          'version': _cribl_packs_manifest[item].version,
          'url': cribl_packs_object_storage_base_url ~ '/' ~ item ~ '.crbl',
          'checksum': 'sha256:' ~ _cribl_packs_manifest[item].sha256
        }
      ] }}
  loop: "{{ _cribl_packs_names }}"
  loop_control:
    label: "{{ item }}"
  when: cribl_packs_object_storage_base_url is defined

- name: Read the latest GitHub release for each Cribl pack
  ansible.builtin.uri:
    url: "https://api.github.com/repos/dryvist/{{ item }}/releases/latest"
    headers:
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"
    return_content: true
    status_code: 200
  loop: "{{ _cribl_packs_names }}"
  loop_control:
    label: "{{ item }}"
  register: cribl_packs_latest_releases
  check_mode: false
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  when: cribl_packs_object_storage_base_url is not defined

- name: Resolve Cribl pack release descriptors
  ansible.builtin.set_fact:
    _cribl_packs_list: >-
      {{ (_cribl_packs_list | default([])) + [
        {
          'name': item.item,
          'version': item.json.tag_name,
          'url': (
            'https://github.com/dryvist/'
            ~ item.item
            ~ '/releases/download/'
            ~ item.json.tag_name
            ~ '/'
            ~ item.item
            ~ '-'
            ~ item.json.tag_name
            ~ '.crbl'
          )
        }
      ] }}
  loop: "{{ cribl_packs_latest_releases.results | default([]) }}"
  loop_control:
    # Skipped release reads carry no json, and Ansible templates the label anyway.
    label: "{{ item.item }} {{ item.json.tag_name | default('') }}"
  when: cribl_packs_object_storage_base_url is not defined

# Edge packs use the local config tree; Stream loads packs from its default tree.
- name: Ensure packs directory exists
  ansible.builtin.file:
    path: "{{ _cribl_packs_pack_root }}"
    state: directory
    owner: "{{ cribl_packs_user }}"
    group: "{{ cribl_packs_group }}"
    mode: "0755"

# Check version sentinels beside each pack in its target-specific install root.
- name: Stat installed-version sentinel for each pack
  ansible.builtin.stat:
    path: "{{ _cribl_packs_pack_root }}/{{ item.name }}/.{{ item.version }}.installed"
  loop: "{{ _cribl_packs_list }}"
  loop_control:
    label: "{{ item.name }}"
  register: cribl_packs_sentinel_stats

# Download pack assets on the controller because the target LXCs cannot reach
# public release hosts; Ansible transfers each .crbl asset to its target.
#
# ansible_become: false (via vars:) is REQUIRED. Task-level `become: false`
# alone is insufficient on Ansible 2.19: the play's `become: true` is
# inherited on delegated tasks, causing `sudo: a password is required` on
# the controller. Setting ansible_become via task vars explicitly overrides
# the inherited value.
- name: Download pack asset to controller
  ansible.builtin.get_url:
    url: "{{ item.item.url }}"
    dest: "/tmp/cribl-pack-{{ inventory_hostname }}-{{ item.item.name }}-{{ item.item.version }}.crbl"
    checksum: "{{ item.item.checksum | default(omit, true) }}"
    mode: "0644"
    force: true
  loop: "{{ cribl_packs_sentinel_stats.results }}"
  loop_control:
    label: "{{ item.item.name }} {{ item.item.version }}"
  when: not item.stat.exists
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false

# Extract beside the install root, not inside Stream's default tree, so the pack
# scanner never sees a half-extracted directory; the rename below is atomic.
- name: Create temporary extraction directory for each pack
  ansible.builtin.tempfile:
    state: directory
    suffix: "-cribl-pack-{{ item.item.name }}"
    path: "{{ _cribl_packs_pack_root if cribl_packs_target == 'edge' else cribl_packs_install_dir }}"
  loop: "{{ cribl_packs_sentinel_stats.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not item.stat.exists
  register: cribl_packs_tmp_dirs

# Both targets install an on-disk pack tree; Cribl registers it at the next start.
- name: Unarchive pack into temporary directory
  ansible.builtin.unarchive:
    src: "/tmp/cribl-pack-{{ inventory_hostname }}-{{ item.item.item.name }}-{{ item.item.item.version }}.crbl"
    dest: "{{ item.path }}"
    owner: "{{ cribl_packs_user }}"
    group: "{{ cribl_packs_group }}"
  loop: "{{ cribl_packs_tmp_dirs.results }}"
  loop_control:
    label: "{{ item.item.item.name }} {{ item.item.item.version }}"
  when: not (item.skipped | default(false))

# Replace the pack directory (and with it any older version sentinel).
- name: Remove existing pack directory before atomic replace
  ansible.builtin.file:
    path: "{{ _cribl_packs_pack_root }}/{{ item.item.item.name }}"
    state: absent
  loop: "{{ cribl_packs_tmp_dirs.results }}"
  loop_control:
    label: "{{ item.item.item.name }}"
  when: not (item.skipped | default(false))

- name: Move extracted pack into place
  ansible.builtin.command:
    cmd: >-
      mv {{ item.path }}
      {{ _cribl_packs_pack_root }}/{{ item.item.item.name }}
  loop: "{{ cribl_packs_tmp_dirs.results }}"
  loop_control:
    label: "{{ item.item.item.name }}"
  when: not (item.skipped | default(false))
  changed_when: true
  notify: "{{ 'Restart cribl edge' if cribl_packs_target == 'edge' else 'Restart cribl stream' }}"

# Stream only registers packs listed in its package.json; with that file present
# the start-up scan ignores new directories. Cribl rebuilds it from the default
# tree when it is absent, so drop it while any catalog pack is unlisted (this
# also repairs a pack tree whose version sentinel already exists).
- name: Read Stream package file
  ansible.builtin.slurp:
    src: "{{ cribl_packs_install_dir }}/package.json"
  register: cribl_packs_package_file
  failed_when: false
  changed_when: false
  when: cribl_packs_target == 'stream'

- name: Remove Stream package file so the restart re-registers installed packs
  ansible.builtin.file:
    path: "{{ cribl_packs_install_dir }}/package.json"
    state: absent
  when:
    - cribl_packs_target == 'stream'
    - >-
      _cribl_packs_list | map(attribute='name')
      | difference((cribl_packs_package_file.content | default('e30=') | b64decode
      | from_json).dependencies | default({}) | list) | length > 0
  notify: Restart cribl stream

# Record the requested version beside the installed pack for future skip checks.
- name: Write installed-version sentinel
  ansible.builtin.copy:
    dest: >-
      {{ _cribl_packs_pack_root }}/{{
      item.item.name }}/.{{ item.item.version }}.installed
    content: "{{ item.item.version }}\n"
    owner: "{{ cribl_packs_user }}"
    group: "{{ cribl_packs_group }}"
    mode: "0644"
  loop: "{{ cribl_packs_sentinel_stats.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not item.stat.exists

- name: Remove pack staging files from controller
  ansible.builtin.file:
    path: "/tmp/cribl-pack-{{ inventory_hostname }}-{{ item.item.name }}-{{ item.item.version }}.crbl"
    state: absent
  loop: "{{ cribl_packs_sentinel_stats.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not item.stat.exists
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false

# A pack directory without its manifest is not a pack; report where each one
# stands so a load failure shows the on-disk state in the converge log.
- name: Stat each installed pack directory
  ansible.builtin.stat:
    path: "{{ _cribl_packs_pack_root }}/{{ item.name }}"
  loop: "{{ _cribl_packs_list }}"
  loop_control:
    label: "{{ item.name }}"
  register: cribl_packs_dir_stats

- name: Stat each installed pack manifest
  ansible.builtin.stat:
    path: "{{ _cribl_packs_pack_root }}/{{ item.name }}/package.json"
  loop: "{{ _cribl_packs_list }}"
  loop_control:
    label: "{{ item.name }}"
  register: cribl_packs_manifest_stats

- name: Report installed pack layout
  ansible.builtin.debug:
    msg: >-
      {{ item.item.name }}: dir={{ item.stat.exists }}
      owner={{ item.stat.pw_name | default('-') }}
      mode={{ item.stat.mode | default('-') }}
      manifest={{ cribl_packs_manifest_stats.results[idx].stat.exists }}
  loop: "{{ cribl_packs_dir_stats.results }}"
  loop_control:
    label: "{{ item.item.name }}"
    index_var: idx

- name: Assert each installed pack has a manifest
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "{{ item.item.name }} has no package.json under {{ _cribl_packs_pack_root }}"
    quiet: true
  loop: "{{ cribl_packs_manifest_stats.results }}"
  loop_control:
    label: "{{ item.item.name }}"
