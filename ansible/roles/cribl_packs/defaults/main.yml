---
# Cribl install paths (must match cribl_edge / cribl_stream roles)
cribl_packs_install_dir: /opt/cribl
cribl_packs_user: cribl
cribl_packs_group: cribl

# Edge service unit (matches cribl_edge_service_name)
cribl_packs_edge_service: cribl-edge
# Stream service unit (matches cribl_stream_service_name)
cribl_packs_stream_service: cribl

# Edge config tree root (cribl mode-edge)
cribl_packs_edge_config_root: "{{ cribl_packs_install_dir }}/local/edge"
# Stream config tree root
cribl_packs_stream_config_root: "{{ cribl_packs_install_dir }}/local/cribl"

# Object-storage (RustFS) bucket URL that playbooks/sync-cribl-packs.yml
# (ansible-proxmox-apps) mirrors dryvist/cc-* pack releases into, and this
# role's own manifest.json + .crbl assets live under. No default: every
# consumer sets it in inventory (see inventory/group_vars/cribl_edge.yml /
# cribl_stream_group.yml in ansible-proxmox-apps) from its own tofu_data,
# since the endpoint is per-estate infrastructure, not a value this shared
# collection can know.
cribl_packs_object_storage_bucket_url: ""
cribl_packs_manifest_key: cribl-packs/manifest.json
cribl_packs_manifest_url: "{{ cribl_packs_object_storage_bucket_url }}/{{ cribl_packs_manifest_key }}"

# Per-group pack selection: bare pack NAMES only — version, download key and
# sha256 are resolved from the manifest at run time, never declared here.
# Override per inventory by setting cribl_packs_for_edge / cribl_packs_for_stream
# in group_vars.
cribl_packs_for_edge: []
cribl_packs_for_stream: []
