---
# Fetches ONE resource domain. openbao_domain is the loop variable set by main.yml,
# which delegates the block, so every task here runs on the controller.
#
# A path is a string, or a mapping with path, mount, optional and enabled. A string
# path is required. A mapping path is required unless optional is true, and is read
# only when enabled is not false.

- name: Resolve the AppRole pair for {{ openbao_domain.name }}
  ansible.builtin.include_tasks: resolve_approle.yml

- name: Select the enabled paths for {{ openbao_domain.name }}
  ansible.builtin.set_fact:
    openbao_secrets_domain_paths_to_read: >-
      {{ openbao_domain.paths | rejectattr('enabled', 'equalto', false) | list }}
  no_log: true

- name: Decide whether every enabled path is optional for {{ openbao_domain.name }}
  ansible.builtin.set_fact:
    openbao_secrets_domain_all_optional: >-
      {{ (openbao_secrets_domain_paths_to_read | selectattr('optional', 'defined')
          | selectattr('optional') | list | length)
         == (openbao_secrets_domain_paths_to_read | length) }}
  no_log: true

- name: Check the workstation issuer inputs for {{ openbao_domain.name }}
  ansible.builtin.set_fact:
    openbao_secrets_issuer_role_set: "{{ openbao_domain.workstation_issuer_role | default('', true) | length > 0 }}"
    openbao_secrets_issuer_pair_present: >-
      {{ (lookup('env', 'OPENBAO_APPROLE_APPROLE_ISSUER_ROLE_ID') | length > 0)
         and (lookup('env', 'OPENBAO_APPROLE_APPROLE_ISSUER_SECRET_ID') | length > 0) }}
    openbao_secrets_issuer_pair_partial: >-
      {{ (lookup('env', 'OPENBAO_APPROLE_APPROLE_ISSUER_ROLE_ID') | length > 0)
         != (lookup('env', 'OPENBAO_APPROLE_APPROLE_ISSUER_SECRET_ID') | length > 0) }}
    openbao_secrets_flow_lock_present: "{{ lookup('ansible.builtin.pipe', 'command -v flow-lock || true') | length > 0 }}"
  no_log: true

- name: Fail on an incomplete workstation issuer pair for {{ openbao_domain.name }}
  ansible.builtin.fail:
    msg: >-
      The approle-issuer pair is incomplete for {{ openbao_domain.name }}: exactly one of
      its two variables is set. Refusing to fall back to the domain's stored secret_id.
  when:
    - openbao_secrets_issuer_role_set | bool
    - openbao_secrets_issuer_pair_partial | bool

- name: Decide the login path for {{ openbao_domain.name }}
  ansible.builtin.set_fact:
    openbao_secrets_domain_use_issuer: >-
      {{ openbao_secrets_issuer_role_set | bool and openbao_secrets_issuer_pair_present | bool
         and openbao_secrets_flow_lock_present | bool }}
    openbao_secrets_domain_login_configured: >-
      {{ (openbao_secrets_issuer_role_set | bool and openbao_secrets_issuer_pair_present | bool
          and openbao_secrets_flow_lock_present | bool)
         or (openbao_secrets_domain_role_id | length > 0 and openbao_secrets_domain_secret_id | length > 0) }}
  no_log: true

- name: Fail when a domain has no AppRole login — {{ openbao_domain.name }}
  ansible.builtin.fail:
    msg: >-
      {{ openbao_domain.name }} has no AppRole login: neither its workstation issuer nor
      an AppRole pair is configured. Supply the pair, or list the domain in
      openbao_secrets_optional_domains to skip it deliberately.
  when:
    - openbao_secrets_domain_paths_to_read | length > 0
    - not (openbao_secrets_domain_login_configured | bool)
    - >-
      (openbao_domain.required | default(false) | bool)
      or (openbao_secrets_fail_on_missing_credentials | bool
          and openbao_domain.name not in openbao_secrets_optional_domains)

- name: Skip a domain with no AppRole login — {{ openbao_domain.name }}
  ansible.builtin.debug:
    msg: >-
      {{ openbao_domain.name }} has no AppRole login configured, so it is skipped. Its
      consumers resolve nothing from OpenBao on this run.
  when:
    - openbao_secrets_domain_paths_to_read | length > 0
    - not (openbao_secrets_domain_login_configured | bool)
    - not (openbao_domain.required | default(false) | bool)
    - >-
      not (openbao_secrets_fail_on_missing_credentials | bool
           and openbao_domain.name not in openbao_secrets_optional_domains)

- name: Fetch the domain when it has a login path — {{ openbao_domain.name }}
  ansible.builtin.include_tasks: login_and_read.yml
  when:
    - openbao_secrets_domain_paths_to_read | length > 0
    - openbao_secrets_domain_login_configured | bool
