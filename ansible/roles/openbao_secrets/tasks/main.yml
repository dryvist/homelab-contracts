---
# Driver: reads each selected domain once on the controller and publishes the
# merged KV data as hostvars['localhost'].openbao_secrets_by_domain, keyed by domain
# name. Callers copy the domains they consume into per-host facts in a pre-fetch play.
#
# Health probes, logins and KV reads run under --check too (check_mode: false).
# vault_login returns no usable token in check mode, and a check run would then
# look exactly like a missing credential.

- name: Decide whether OpenBao is configured
  ansible.builtin.set_fact:
    openbao_secrets_configured: "{{ openbao_secrets_bao_addr_candidates | length > 0 }}"

# delegate_facts is required: set_fact + delegate_to + run_once without it writes the
# fact to the play host, and hostvars['localhost'].openbao_secrets_by_domain would be
# undefined for the calling play.
- name: Initialize the controller-side read results
  ansible.builtin.set_fact:
    openbao_secrets_active_addr: ""
    openbao_secrets_by_domain: {}
    openbao_secrets_isolated_failures: []
  delegate_to: localhost
  delegate_facts: true
  connection: local
  become: false
  vars:
    ansible_become: false
  run_once: true

- name: Report that OpenBao is not configured
  ansible.builtin.debug:
    msg: >-
      No OpenBao endpoint is configured (no address in the environment and no
      openbao-tagged node in the inventory). openbao_secrets skips the read path.
  run_once: true
  when: not openbao_secrets_configured

# Each domain's AppRole env prefix is derived from its name, so two names that
# normalize to the same prefix would read each other's credentials.
- name: Assert the domain names map to distinct AppRole env prefixes
  ansible.builtin.assert:
    that:
      - >-
        (openbao_secrets_domains | map(attribute='name') | map('upper')
        | map('regex_replace', '[^A-Z0-9]', '_') | unique | list | length)
        == (openbao_secrets_domains | length)
    fail_msg: >-
      Two OpenBao domain names share an AppRole env prefix:
      {{ openbao_secrets_domains | map(attribute='name') | join(', ') }}
    quiet: true
  run_once: true

- name: Probe OpenBao endpoints for a reachable, unsealed node
  ansible.builtin.uri:
    url: "{{ item }}/v1/sys/health?standbyok=true&perfstandbyok=true"
    method: GET
    validate_certs: "{{ openbao_secrets_validate_certs }}"
    timeout: 5
  loop: "{{ openbao_secrets_bao_addr_candidates }}"
  loop_control:
    label: "{{ item }}"
  register: openbao_secrets_health
  failed_when: false
  changed_when: false
  check_mode: false
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  run_once: true
  when: openbao_secrets_configured

- name: Pin the first reachable OpenBao endpoint
  ansible.builtin.set_fact:
    openbao_secrets_active_addr: >-
      {{ (openbao_secrets_health.results
          | selectattr('status', 'defined')
          | selectattr('status', 'equalto', 200)
          | map(attribute='item') | list | first) | default('', true) }}
  delegate_to: localhost
  delegate_facts: true
  connection: local
  become: false
  vars:
    ansible_become: false
  run_once: true
  when: openbao_secrets_configured

- name: Decide whether a usable OpenBao endpoint was found
  ansible.builtin.set_fact:
    openbao_secrets_active: >-
      {{ (hostvars['localhost'].openbao_secrets_active_addr | default('', true)) | length > 0 }}

- name: Fail when OpenBao is configured but no endpoint answered
  ansible.builtin.fail:
    msg: >-
      OpenBao is configured but none of {{ openbao_secrets_bao_addr_candidates }}
      answered /v1/sys/health unsealed. Refusing to continue: a converge that cannot
      read its secrets must stop.
  run_once: true
  when:
    - openbao_secrets_configured
    - not openbao_secrets_active
    - openbao_secrets_fail_when_unavailable | bool

- name: Report that no OpenBao endpoint answered
  ansible.builtin.debug:
    msg: >-
      OpenBao is configured but no endpoint answered /v1/sys/health unsealed;
      the read path is skipped for this run.
  run_once: true
  when:
    - openbao_secrets_configured
    - not openbao_secrets_active
    - not (openbao_secrets_fail_when_unavailable | bool)

- name: Fetch each selected domain on the controller
  when: openbao_secrets_active
  delegate_to: localhost
  connection: local
  become: false
  run_once: true
  vars:
    ansible_become: false
  block:
    - name: Select the domains this run's host groups need
      ansible.builtin.include_tasks: narrow_domains.yml

    - name: Fetch and merge each selected domain
      ansible.builtin.include_tasks: fetch_domain.yml
      loop: "{{ openbao_secrets_domains_to_fetch }}"
      loop_control:
        loop_var: openbao_domain
        label: "{{ openbao_domain.name }}"

    - name: Report every domain isolated during this run
      ansible.builtin.debug:
        msg: >-
          WARNING: these domains failed and were isolated; each publishes an empty
          result: {{ hostvars['localhost'].openbao_secrets_isolated_failures | join(' | ') }}
      when: hostvars['localhost'].openbao_secrets_isolated_failures | length > 0
