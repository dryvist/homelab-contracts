---
# Resolves one domain's AppRole pair from the environment. A domain may name another
# domain's credential identity with credential_domain; by default it is its own name.
#
# Resolution order: SECRET_STORE_<CRED>_*, then OPENBAO_APPROLE_<CRED>_*, then the
# domain's own role_id_env / secret_id_env, then the legacy <CRED>_VAULT_* pair, then
# the operator pair for operator domains.
- name: Resolve the credential identity for {{ openbao_domain.name }}
  ansible.builtin.set_fact:
    openbao_secrets_domain_env_stem: >-
      {{ (openbao_domain.credential_domain | default(openbao_domain.name, true))
         | upper | regex_replace('[^A-Z0-9]', '_') }}
  no_log: true

- name: Resolve role_id/secret_id from env for {{ openbao_domain.name }}
  ansible.builtin.set_fact:
    openbao_secrets_domain_role_id: >-
      {{ lookup('env', 'SECRET_STORE_' ~ openbao_secrets_domain_env_stem ~ '_ROLE_ID')
         | default(lookup('env', 'OPENBAO_APPROLE_' ~ openbao_secrets_domain_env_stem ~ '_ROLE_ID'), true)
         | default(lookup('env', openbao_domain.role_id_env)
                   if openbao_domain.role_id_env is defined else '', true)
         | default(lookup('env', openbao_secrets_domain_env_stem ~ '_VAULT_ROLE_ID'), true)
         | default(lookup('env', 'OPERATOR_VAULT_ROLE_ID')
                   if openbao_domain.name in openbao_secrets_operator_domains else '', true) }}
    openbao_secrets_domain_secret_id: >-
      {{ lookup('env', 'SECRET_STORE_' ~ openbao_secrets_domain_env_stem ~ '_SECRET_ID')
         | default(lookup('env', 'OPENBAO_APPROLE_' ~ openbao_secrets_domain_env_stem ~ '_SECRET_ID'), true)
         | default(lookup('env', openbao_domain.secret_id_env)
                   if openbao_domain.secret_id_env is defined else '', true)
         | default(lookup('env', openbao_secrets_domain_env_stem ~ '_VAULT_SECRET_ID'), true)
         | default(lookup('env', 'OPERATOR_VAULT_SECRET_ID')
                   if openbao_domain.name in openbao_secrets_operator_domains else '', true) }}
  no_log: true
