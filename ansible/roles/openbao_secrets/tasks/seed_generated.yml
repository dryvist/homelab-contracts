---
# Generate-if-absent seeding of fields in one KV v2 secret. Called through
# include_role with tasks_from: seed_generated; the interface is documented in
# meta/argument_specs.yml.
#
# A stored field keeps its value unless it is named in rotate_fields or its
# valid_pattern rejects it. A missing field takes the caller's value, or a
# generated one. Everything is written in one check-and-set write: cas=0 creates
# a new secret, and cas=<version read above> adds fields to an existing one. A
# writer that changed the secret in between makes the write fail, so nothing is
# overwritten silently.
#
# Every task that handles a token or a value is no_log. Check mode reads existing
# values, returns a marked placeholder for generated values, and writes nothing.

- name: Require a valid name for the caller-visible result fact
  ansible.builtin.assert:
    that:
      - openbao_secrets_seed_register is match('^[A-Za-z_][A-Za-z0-9_]*$')
    fail_msg: "openbao_secrets_seed_register must be a valid Ansible fact name"
  no_log: true

- name: Require every rotate field to be a declared field
  ansible.builtin.assert:
    that:
      - >-
        (openbao_secrets_seed_rotate_fields
         | difference(openbao_secrets_seed_fields | map(attribute='name') | list)
         | length) == 0
    fail_msg: "openbao_secrets_seed_rotate_fields names a field that is not in openbao_secrets_seed_fields"
  no_log: true

- name: Probe OpenBao health when an endpoint is configured
  ansible.builtin.uri:
    url: "{{ openbao_secrets_seed_addr }}/v1/sys/health?standbyok=true&perfstandbyok=true"
    method: GET
    validate_certs: "{{ openbao_secrets_validate_certs }}"
    timeout: 5
  register: openbao_secrets_seed_health
  failed_when: false
  changed_when: false
  check_mode: false
  when: openbao_secrets_seed_addr | default('', true) | length > 0

- name: Decide whether OpenBao is configured, reachable and unsealed for this run
  ansible.builtin.set_fact:
    openbao_secrets_seed_available: >-
      {{ (openbao_secrets_seed_addr | default('', true) | length > 0)
         and ((openbao_secrets_seed_health.status | default(0) | int) == 200) }}
  no_log: true

- name: Return local values when OpenBao is unavailable
  when: not (openbao_secrets_seed_available | bool)
  block:
    - name: Start the local fallback result accumulator
      ansible.builtin.set_fact:
        openbao_secrets_seed_result_values: {}
      no_log: true

    - name: Collect declared, nonempty local fallback values
      ansible.builtin.set_fact:
        openbao_secrets_seed_result_values: >-
          {{ openbao_secrets_seed_result_values | combine({
               item.name: openbao_secrets_seed_local_values.get(item.name, '')
             }) }}
      loop: "{{ openbao_secrets_seed_fields }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - openbao_secrets_seed_local_values.get(item.name, '') is string
        - openbao_secrets_seed_local_values.get(item.name, '') | trim | length > 0
      no_log: true

    - name: Require usable local values when OpenBao is unavailable
      ansible.builtin.assert:
        that:
          - openbao_secrets_seed_result_values | length > 0
        fail_msg: >-
          OpenBao is not configured or did not return health status 200, and no usable
          openbao_secrets_seed_local_values were supplied.
      no_log: true

    - name: Publish the local fallback result to the caller
      ansible.builtin.set_fact:
        "{{ openbao_secrets_seed_register }}": "{{ openbao_secrets_seed_result_values }}"
      no_log: true

- name: Require a writer token when OpenBao is available
  ansible.builtin.assert:
    that:
      - openbao_secrets_seed_token | length > 0
    fail_msg: "OpenBao is reachable but no seed writer token was supplied"
  when: openbao_secrets_seed_available | bool
  no_log: true

- name: Seed generated fields (the writer token is revoked on every exit path when asked)
  vars:
    openbao_secrets_seed_data_path: "{{ openbao_secrets_seed_mount }}/data/{{ openbao_secrets_seed_path }}"
    openbao_secrets_seed_metadata_path: "{{ openbao_secrets_seed_mount }}/metadata/{{ openbao_secrets_seed_path }}"
  when: openbao_secrets_seed_available | bool
  block:
    - name: Check the writer token's exact identity
      when: openbao_secrets_seed_expected_writer_policy | length > 0
      block:
        - name: Read the writer token's identity
          ansible.builtin.uri:
            url: "{{ openbao_secrets_seed_addr }}/v1/auth/token/lookup-self"
            method: GET
            headers:
              X-Vault-Token: "{{ openbao_secrets_seed_token }}"
            status_code: [200]
            validate_certs: "{{ openbao_secrets_validate_certs }}"
          register: openbao_secrets_seed_identity
          changed_when: false
          check_mode: false
          no_log: true

        - name: Require the exact short-lived writer identity
          ansible.builtin.assert:
            that:
              - >-
                (openbao_secrets_seed_identity.json.data.policies | sort)
                == (['default', openbao_secrets_seed_expected_writer_policy] | sort)
              - openbao_secrets_seed_identity.json.data.identity_policies | default([]) | length == 0
              - not (openbao_secrets_seed_identity.json.data.renewable | bool)
              - openbao_secrets_seed_identity.json.data.orphan | bool
              - openbao_secrets_seed_identity.json.data.ttl | int > 0
              - openbao_secrets_seed_identity.json.data.ttl | int <= openbao_secrets_seed_writer_max_ttl | int
            fail_msg: >-
              The writer token must carry exactly default and {{ openbao_secrets_seed_expected_writer_policy }},
              have no identity policies, be nonrenewable and orphaned, and have a TTL of 1 to
              {{ openbao_secrets_seed_writer_max_ttl }} seconds.
          no_log: true

    - name: Check the writer token's exact capabilities
      when: openbao_secrets_seed_check_capabilities | bool
      block:
        - name: Read the writer token's capabilities on the data and metadata paths
          ansible.builtin.uri:
            url: "{{ openbao_secrets_seed_addr }}/v1/sys/capabilities-self"
            method: POST
            headers:
              X-Vault-Token: "{{ openbao_secrets_seed_token }}"
            body_format: json
            body:
              paths:
                - "{{ openbao_secrets_seed_data_path }}"
                - "{{ openbao_secrets_seed_metadata_path }}"
            status_code: [200]
            validate_certs: "{{ openbao_secrets_validate_certs }}"
          register: openbao_secrets_seed_capabilities
          changed_when: false
          check_mode: false
          no_log: true

        - name: Require create, read and update on data and read on metadata
          ansible.builtin.assert:
            that:
              - >-
                (openbao_secrets_seed_capabilities.json.data.get(openbao_secrets_seed_data_path, [])
                 | sort) == ['create', 'read', 'update']
              - >-
                (openbao_secrets_seed_capabilities.json.data.get(openbao_secrets_seed_metadata_path, [])
                 | sort) == ['read']
            fail_msg: >-
              The writer token must have exactly create, read and update on {{ openbao_secrets_seed_data_path }}
              and exactly read on {{ openbao_secrets_seed_metadata_path }}.
          no_log: true

    - name: Read the stored secret and its version
      ansible.builtin.uri:
        url: "{{ openbao_secrets_seed_addr }}/v1/{{ openbao_secrets_seed_data_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ openbao_secrets_seed_token }}"
        # 404 is an absent or soft-deleted secret. Any other status, a denial included, fails the run.
        status_code: [200, 404]
        validate_certs: "{{ openbao_secrets_validate_certs }}"
      register: openbao_secrets_seed_read
      changed_when: false
      check_mode: false
      no_log: true

    # A soft-deleted secret answers 404 with its metadata still present. Writing with that
    # version succeeds; cas=0 would not.
    - name: Capture the stored fields and the version to check-and-set against
      ansible.builtin.set_fact:
        openbao_secrets_seed_stored: >-
          {{ (((openbao_secrets_seed_read.json | default({}, true)).data | default({}, true)).data
              | default({}, true)) }}
        openbao_secrets_seed_version: >-
          {{ ((((openbao_secrets_seed_read.json | default({}, true)).data | default({}, true)).metadata
               | default({}, true)).version | default(0, true) | int) }}
      no_log: true

    # ansible_check_mode only reflects the --check flag, not a check_mode keyword on an enclosing
    # include. A command task inherits that keyword and reports skipped while it is in effect.
    - name: Detect whether this run is in check mode
      ansible.builtin.command:
        argv: ["true"]
      changed_when: false
      register: openbao_secrets_seed_check_probe

    - name: Record whether this run is in check mode
      ansible.builtin.set_fact:
        openbao_secrets_seed_in_check_mode: "{{ openbao_secrets_seed_check_probe.skipped | default(false) | bool }}"
      no_log: true

    - name: Start the desired-field accumulator
      ansible.builtin.set_fact:
        openbao_secrets_seed_desired: {}
      no_log: true

    # A field is planned when it is absent, named in rotate_fields, or its stored value fails valid_pattern.
    # Its value is the caller's value when given; otherwise a generated value with the prefix added.
    - name: Plan each field that needs a value
      ansible.builtin.set_fact:
        openbao_secrets_seed_desired: >-
          {{ openbao_secrets_seed_desired | combine({
               item.name: (item.value
                            if (item.value | default('', true) | length > 0)
                            else ('(placeholder in check mode)'
                                  if openbao_secrets_seed_in_check_mode
                                  else ((item.prefix | default('', true))
                                        ~ lookup('community.general.random_string',
                                                 length=(item.length | default(32)),
                                                 override_all=openbao_secrets_seed_alphabets[item.charset | default('alnum')]))))
             }) }}
      loop: "{{ openbao_secrets_seed_fields }}"
      loop_control:
        label: "{{ item.name }}"
      when: >-
        ((openbao_secrets_seed_stored[item.name] | default('', true)) | length == 0)
        or (item.name in openbao_secrets_seed_rotate_fields)
        or ((item.valid_pattern | default('', true)) | length > 0
            and not ((openbao_secrets_seed_stored[item.name] | default('', true)) is match(item.valid_pattern)))
      no_log: true

    - name: Report the field names a real run would write
      ansible.builtin.debug:
        msg: >-
          Would write {{ openbao_secrets_seed_desired.keys() | list | sort | join(', ') }}
          to {{ openbao_secrets_seed_data_path }}
      when:
        - openbao_secrets_seed_in_check_mode | bool
        - openbao_secrets_seed_desired | length > 0

    - name: Write the merged secret (check-and-set on the version read above)
      ansible.builtin.uri:
        url: "{{ openbao_secrets_seed_addr }}/v1/{{ openbao_secrets_seed_data_path }}"
        method: POST
        headers:
          X-Vault-Token: "{{ openbao_secrets_seed_token }}"
        body_format: json
        body:
          options:
            cas: "{{ openbao_secrets_seed_version | int }}"
          data: "{{ openbao_secrets_seed_stored | combine(openbao_secrets_seed_desired) }}"
        status_code: [200]
        validate_certs: "{{ openbao_secrets_validate_certs }}"
      when:
        - openbao_secrets_seed_desired | length > 0
        - not (openbao_secrets_seed_in_check_mode | bool)
      no_log: true

    - name: Start the caller-visible result accumulator
      ansible.builtin.set_fact:
        openbao_secrets_seed_result_values: {}
      no_log: true

    - name: Collect each declared field's final value
      ansible.builtin.set_fact:
        openbao_secrets_seed_result_values: >-
          {{ openbao_secrets_seed_result_values | combine({
               item.name: openbao_secrets_seed_desired.get(
                 item.name, openbao_secrets_seed_stored.get(item.name, ''))
             }) }}
      loop: "{{ openbao_secrets_seed_fields }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Publish the final field values to the caller
      ansible.builtin.set_fact:
        "{{ openbao_secrets_seed_register }}": "{{ openbao_secrets_seed_result_values }}"
      no_log: true

  always:
    - name: Self-revoke the writer token
      ansible.builtin.uri:
        url: "{{ openbao_secrets_seed_addr }}/v1/auth/token/revoke-self"
        method: POST
        headers:
          X-Vault-Token: "{{ openbao_secrets_seed_token }}"
        status_code: [200, 204]
        validate_certs: "{{ openbao_secrets_validate_certs }}"
      when:
        - openbao_secrets_seed_available | bool
        - openbao_secrets_seed_revoke_token | bool
      no_log: true
