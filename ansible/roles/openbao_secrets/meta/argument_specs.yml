---
argument_specs:
  main:
    short_description: Read the configured OpenBao domains on the controller
    description:
      - Logs in once per domain, reads its enabled paths, and publishes the merged data as
        C(hostvars['localhost'].openbao_secrets_by_domain), keyed by domain name.
      - Every switch defaults to this role's original behaviour. A stricter value is opt-in.
      - Include it with C(include_role). It delegates to localhost and runs once per play.
    options:
      openbao_secrets_bao_addr:
        type: str
        description: OpenBao base URL. Defaults to C(SECRET_STORE_ADDR), then C(BAO_ADDR).
      openbao_secrets_kv_mount:
        type: str
        description: Default KV v2 mount for paths that do not name one.
      openbao_secrets_validate_certs:
        type: bool
        description: Verify the OpenBao TLS certificate.
      openbao_secrets_domains:
        type: list
        elements: dict
        description:
          - One entry per domain. C(name) is required; C(paths) is a list of strings or mappings.
          - A path mapping takes C(path), and optionally C(mount), C(optional) and C(enabled).
          - C(credential_domain) names another domain whose AppRole pair to use.
          - C(workstation_issuer_role) selects the flow-lock issuer login when the issuer pair is set.
          - C(required) makes a missing login fail the play, even for a domain listed as optional.
      openbao_secrets_domain_groups:
        type: dict
        description: Maps a domain name to its consumer groups. A domain with no entry is always fetched.
      openbao_secrets_active_groups:
        type: list
        elements: str
        description: Consumer groups active in this run. Used with C(openbao_secrets_domain_groups).
      openbao_secrets_optional_domains:
        type: list
        elements: str
        description: Domains that may skip when no AppRole login is configured and fail-on-missing is set.
      openbao_secrets_fail_on_missing_credentials:
        type: bool
        description: When true, a domain with no AppRole login fails the play unless it is optional.
      openbao_secrets_fail_when_unavailable:
        type: bool
        description: When true, no reachable OpenBao endpoint fails the play. When false the read path is skipped.
      openbao_secrets_skip_cidr_refusals:
        type: bool
        description: When true, a login refused on source-address grounds skips that domain and publishes no key.
      openbao_secrets_isolate_optional_login_failures:
        type: bool
        description:
          - When true, a failed login in a domain whose every path is optional is recorded, publishes an empty
            result, and the run continues.
          - When false the play fails.
      openbao_secrets_strict_reads:
        type: bool
        description:
          - When true, a 404 on a required path and any 403 or transport error fails the domain.
          - A 404 on a path declared C(optional) is still skipped with a warning.
          - When false, unreadable paths are ignored.
      openbao_secrets_isolate_optional_read_failures:
        type: bool
        description:
          - Only with C(openbao_secrets_strict_reads). When true, a domain whose every path is optional
            publishes an empty result on an unreadable path instead of failing the play.
      openbao_secrets_alert_ntfy_url:
        type: str
        description:
          - Optional ntfy URL. When set, an isolated domain sends a best-effort page naming the domain and failure class only.
  assert_nonempty:
    short_description: Fail when a named secret variable resolved empty
    description:
      - Call it with C(include_role) and C(tasks_from) set to C(assert_nonempty). Only names are printed.
    options:
      openbao_secrets_required_vars:
        type: list
        elements: str
        required: true
        description: Variable names that must resolve to a non-empty value.
  seed_generated:
    short_description: Generate-if-absent seeding of fields in one KV v2 secret
    description:
      - Adds the missing fields of one KV v2 secret, with generated or caller-supplied values, in a single
        check-and-set write that merges them into the stored data.
      - A stored field is never rewritten unless it is named in C(openbao_secrets_seed_rotate_fields) or
        fails its own C(valid_pattern).
      - A secret that does not exist is created with C(cas=0), so a concurrent creator makes the play fail
        instead of being overwritten.
      - Call it with C(include_role) and C(tasks_from) set to C(seed_generated). The role does not delegate;
        wrap the call in a block with C(delegate_to) when the writes must run from another host.
    options:
      openbao_secrets_seed_addr:
        type: str
        description:
          - OpenBao base URL, for example C(https://openbao.example.test:8200). Defaults to C(openbao_secrets_bao_addr).
          - When unset or not reachable and C(openbao_secrets_seed_local_values) has usable values, the task returns
            those values without contacting the KV paths or writing anything.
      openbao_secrets_seed_token:
        type: str
        no_log: true
        description:
          - Writer token. Required when the health endpoint returns C(200); it needs create, read and update on the
            data path and read on the metadata path.
          - It is revoked at the end of the run only when C(openbao_secrets_seed_revoke_token) is true.
      openbao_secrets_seed_path:
        type: str
        required: true
        description: Secret path under the mount, without the C(data/) segment.
      openbao_secrets_seed_mount:
        type: str
        description: KV v2 mount. Defaults to C(openbao_secrets_kv_mount).
      openbao_secrets_seed_fields:
        type: list
        elements: dict
        required: true
        description: Fields that must exist in the secret after the run.
        options:
          name:
            type: str
            required: true
            description: Field name inside the secret's data.
          length:
            type: int
            default: 32
            description: Length of the random part of a generated value (the prefix is added on top).
          charset:
            type: str
            default: alnum
            choices: [alnum, lower, lower_alpha, upper_numeric, hex]
            description: >-
              Alphabet for the random part. C(lower_alpha) gives lowercase letters only; C(upper_numeric) gives
              uppercase letters and digits only; C(hex) gives lowercase hexadecimal.
          prefix:
            type: str
            default: ""
            description: Fixed text placed before a generated value, for example C(sk-).
          valid_pattern:
            type: str
            description:
              - Regular expression a stored value must match. A stored value that does not match is regenerated.
              - Without this key a stored value is never regenerated, except through C(rotate_fields).
          value:
            type: str
            no_log: true
            description:
              - Caller-supplied value written only when the field is absent (or regenerated by
                C(valid_pattern) or C(rotate_fields)). It replaces the generated value.
      openbao_secrets_seed_rotate_fields:
        type: list
        elements: str
        description: Field names whose stored value is regenerated on this run. Each must be listed in C(openbao_secrets_seed_fields).
      openbao_secrets_seed_register:
        type: str
        description:
          - Name of the no-log fact that receives a dict of declared field names to their final values.
          - Defaults to C(openbao_secrets_seed_result).
      openbao_secrets_seed_local_values:
        type: dict
        description:
          - Caller-provided field values to return without writing when no endpoint is configured or its health response is not C(200).
          - Only declared fields with nonempty string values are returned.
          - An empty mapping preserves the OpenBao-required behavior.
      openbao_secrets_seed_revoke_token:
        type: bool
        description: Revoke the writer token (self-revoke) when the run ends, on success or failure.
      openbao_secrets_seed_check_capabilities:
        type: bool
        description: Before reading, assert the writer token's exact capabilities through C(sys/capabilities-self).
      openbao_secrets_seed_expected_writer_policy:
        type: str
        description:
          - When set, the writer token's identity is asserted before anything else. Its policies must be exactly
            C(default) and this policy, it must have no identity policies, it must be orphaned and not renewable,
            and its TTL must be between 1 and C(openbao_secrets_seed_writer_max_ttl) seconds.
          - Leave empty to skip the identity check.
      openbao_secrets_seed_writer_max_ttl:
        type: int
        description: Largest remaining TTL, in seconds, that the identity check accepts.
