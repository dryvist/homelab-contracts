---
argument_specs:
  seed_generated:
    short_description: Generate-if-absent seeding of fields in one KV v2 secret
    description:
      - Adds the missing fields of one KV v2 secret, with generated or caller-supplied values, in a single
        check-and-set write that merges them into the stored data.
      - A stored field is never rewritten unless it is named in C(openbao_secrets_seed_rotate_fields) or
        fails its own C(valid_pattern).
      - A secret that does not exist is created with C(cas=0), so a concurrent creator makes the play fail
        instead of being overwritten.
      - Call it with C(include_role) and C(tasks_from) set to C(seed_generated). The role does not delegate;
        wrap the call in a block with C(delegate_to) when the writes must run from another host.
    options:
      openbao_secrets_seed_addr:
        type: str
        required: true
        description: OpenBao base URL, for example C(https://openbao.example.test:8200).
      openbao_secrets_seed_token:
        type: str
        required: true
        no_log: true
        description:
          - Writer token. It needs create, read and update on the data path and read on the metadata path.
          - It is revoked at the end of the run only when C(openbao_secrets_seed_revoke_token) is true.
      openbao_secrets_seed_path:
        type: str
        required: true
        description: Secret path under the mount, without the C(data/) segment.
      openbao_secrets_seed_mount:
        type: str
        description: KV v2 mount. Defaults to C(openbao_secrets_kv_mount).
      openbao_secrets_seed_fields:
        type: list
        elements: dict
        required: true
        description: Fields that must exist in the secret after the run.
        options:
          name:
            type: str
            required: true
            description: Field name inside the secret's data.
          length:
            type: int
            default: 32
            description: Length of the random part of a generated value (the prefix is added on top).
          charset:
            type: str
            default: alnum
            choices: [alnum, lower, hex]
            description: Alphabet for the random part. C(hex) gives lowercase hexadecimal.
          prefix:
            type: str
            default: ""
            description: Fixed text placed before a generated value, for example C(sk-).
          valid_pattern:
            type: str
            description:
              - Regular expression a stored value must match. A stored value that does not match is regenerated.
              - Without this key a stored value is never regenerated, except through C(rotate_fields).
          value:
            type: str
            no_log: true
            description:
              - Caller-supplied value written only when the field is absent (or regenerated by
                C(valid_pattern) or C(rotate_fields)). It replaces the generated value.
      openbao_secrets_seed_rotate_fields:
        type: list
        elements: str
        description: Field names whose stored value is regenerated on this run. Each must be listed in C(openbao_secrets_seed_fields).
      openbao_secrets_seed_revoke_token:
        type: bool
        description: Revoke the writer token (self-revoke) when the run ends, on success or failure.
      openbao_secrets_seed_check_capabilities:
        type: bool
        description: Before reading, assert the writer token's exact capabilities through C(sys/capabilities-self).
      openbao_secrets_seed_expected_writer_policy:
        type: str
        description:
          - When set, the writer token's identity is asserted before anything else. Its policies must be exactly
            C(default) and this policy, it must have no identity policies, it must be orphaned and not renewable,
            and its TTL must be between 1 and C(openbao_secrets_seed_writer_max_ttl) seconds.
          - Leave empty to skip the identity check.
      openbao_secrets_seed_writer_max_ttl:
        type: int
        description: Largest remaining TTL, in seconds, that the identity check accepts.
