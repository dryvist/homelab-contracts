---
# Cribl Edge native installation defaults

# Installation
# Always the rolling "latest" release: Cribl's CDN prunes old versioned
# builds (4.12.2 vanished 2026-07, breaking every fresh install on a pin),
# and the 4.12+ OTel routes fan-out this role depends on is present in all
# newer releases. Install is fresh-install-only (gated on the binary's
# absence), so a moving tag never mutates a running Edge.
# NOTE: the cribl_edge group_vars override the tarball URL with the MinIO
# mirror; keep the mirrored infra/cribl-linux-x64.tgz object current when
# re-staging Edge containers.
cribl_edge_version: "latest"
# Upstream release URL. Cribl's CDN uses two different filename patterns:
#   - versioned release: https://cdn.cribl.io/dl/4.12.2/cribl-4.12.2-linux-x64.tgz
#   - rolling "latest":  https://cdn.cribl.io/dl/latest/cribl-linux-x64.tgz    (no version in filename)
# Group vars for the `cribl_edge` group override this with a MinIO mirror URL
# because the cribl-edge containers have the `outbound-internal` firewall and
# cannot reach cdn.cribl.io directly.
# With version == latest this default is a placeholder that tasks/main.yml
# replaces with the URL body of the `dl/latest` CDN pointer at run time (the
# static dl/latest/cribl-linux-x64.tgz object is abandoned upstream — it
# still serves the 2024 4.8.0-alpha build).
cribl_edge_tarball_url: >-
  https://cdn.cribl.io/dl/{{ cribl_edge_version }}/{{
  'cribl-linux-x64.tgz' if cribl_edge_version == 'latest'
  else 'cribl-' + cribl_edge_version + '-linux-x64.tgz' }}
cribl_edge_install_dir: /opt/cribl

# Service user
cribl_edge_user: cribl
cribl_edge_group: cribl

# Systemd service — the unit file is created by `cribl boot-start enable`,
# which derives the service name from the Cribl operating mode. With
# `cribl mode-edge`, the unit is installed as `cribl-edge.service`.
cribl_edge_service_name: cribl-edge

# Syslog routing from tofu constants (no hardcoded values): per source
# family — standard frontend, high backend (this Edge's listener), and the
# Splunk index/sourcetype the syslog pipeline stamps.
cribl_edge_syslog_routing: >-
  {{ hostvars['localhost']['tofu_data']['constants']['syslog_port_map'] }}

# Edge listeners: high backend ports only. HAProxy owns the standard
# frontends (514-518) and forwards here.
cribl_edge_syslog_port_mappings: >-
  {%- set out = {} -%}
  {%- for family, entry in cribl_edge_syslog_routing | dictsort -%}
  {%- set _ = out.update({family: entry.high}) -%}
  {%- endfor -%}
  {{ out }}
cribl_edge_syslog_ports: "{{ cribl_edge_syslog_port_mappings.values() | list }}"

# UniFi firewall/IPS split: raw-content match (JS regex BODY, no slashes)
# applied to events arriving on the unifi syslog family port. Lines matching
# this pattern are UniFi gateway firewall/IPS traffic and are re-routed to
# index=firewall sourcetype=ubiquiti:firewall BEFORE the plain unifi branch;
# everything else on the port stays index=unifi.
#
# Finalized 2026-07-07 from 20 live gateway samples (L9). Live UDW rule-hit
# tags carry a numeric rule index after the action ("[LOCAL_CUSTOM1-A-2147483647]",
# "[LAN_CUSTOM1-A-10000]"), legacy USG tags do not ("[WAN_LOCAL-4001-D]") —
# the optional trailing -\d+ covers both. The kernel packet-header dump
# ("IN= OUT=br8 MAC=") and suricata IPS alerts complete the alternation.
# Adjust HERE only (single source of truth), the pipeline template just
# interpolates it.
cribl_edge_unifi_fw_match: >-
  \[[A-Z][A-Z0-9_.-]*-[ADR](-\d+)?\]|\bIN=\S* OUT=\S* MAC=|suricata

# Hardware/disk-failure syslog signatures. Raw OS-syslog lines (the os-index
# families — linux/windows) whose _raw matches this JS regex (case-insensitive
# BODY, no surrounding slashes) are reclassified index=os -> index=hardware by
# the syslog pipeline; the splunk_hec_os_router (outputs.yml.j2) then ships
# them to the dedicated splunk_hec_hardware output (hardware HEC token) instead
# of the os catch-all. `I\/O error` is the superset that catches every kernel
# ATA/NVMe/SCSI/Buffer/blk disk-I/O error; smartd, medium/failed-command SCSI
# errors, and ZFS/ZED pool-fault events round it out. Forward slashes are
# escaped (\/) because the pipeline interpolates this between /.../ literals.
# Single source of truth — tune HERE only; the pipeline just interpolates it.
cribl_edge_hardware_match: >-
  smartd|medium error|failed command|I\/O error|vdev_state=|\bZED\b|\bZFS\b

# os catch-all decomposition, by HOST.
#
# index=os accumulated as a catch-all: measured 2026-07-26 it held 39.3M events
# over 13 months from 30+ unrelated hosts, 96.9% of it a single `syslog`
# sourcetype. That defeats per-index retention and access control, and makes
# every index=os search scan unrelated data.
#
# The split axis is HOST, not sourcetype, because sourcetype does not
# distinguish these sources — they are all syslog. Measured 24h shares of the
# os syslog volume:
#   proxmox hypervisors  68.7 MB/day  38.3%   (pve2 alone is 33.9% of all os)
#   AI/agent stack       63.1 MB/day  35.2%
# Together 73.5%. The remaining hosts are each under 2% and stay in os; the
# next candidates if this is taken further are zammad (11.2%) and
# download-vpn (8.5%).
#
# Same mechanism as the hardware reclassify above: the pipeline stamps the new
# index, the output router reads the stamped value. The match lives ONLY here,
# never duplicated into a route filter. Matching is anchored on the host field
# so a hostname appearing inside a log line cannot reroute an unrelated event.
#
# An empty mapping disables the split entirely and everything stays in os.
cribl_edge_os_host_routing:
  os_proxmox: '^pve(\d+|-scripts-local)$'
  os_ai: '^(llm-router-\d+|llm-light|open-webui|hermes-agent|agentgateway|agent-exec)$'

# Edge API bind port from tofu constants (no hardcoded values).
# Templated into local/edge/cribl.yml with host 0.0.0.0 so the API is
# reachable from the internal network, not just 127.0.0.1.
cribl_edge_api_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['cribl_edge_api'] }}

# Splunk HEC configuration — FQDN, never an IP. HEC goes through the
# dedicated splunk-hec Traefik ingress on 443: the splunk.<zone> alias
# resolves to Traefik, which serves nothing on a raw 8088, so dialing
# <alias>:8088 black-holed every HEC POST (the queue backlog in apps#588).
cribl_edge_splunk_host: >-
  splunk-hec.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
  | mandatory('PROXMOX_SUBDOMAIN environment variable is required (Doppler)') }}
cribl_edge_hec_url: "https://{{ cribl_edge_splunk_host }}"
cribl_edge_hec_token: "{{ lookup('env', 'SPLUNK_HEC_TOKEN') }}"

# Per-index HEC tokens (one index = one HEC). When HEC_NAMESPACE (Doppler) is
# set, each index gets a dedicated output whose token is derived the SAME way
# ansible-splunk derives it — uuid5('splunk-hec-<index>', HEC_NAMESPACE) — so no
# token value is ever shared or stored, only the namespace UUID. Empty namespace
# = every input keeps using the shared cribl_edge_hec_token (legacy) output.
cribl_edge_hec_namespace: "{{ lookup('env', 'HEC_NAMESPACE') | default('', true) }}"
# Indexes this Edge writes (syslog families + the netmon-HEC streams). Each gets
# a splunk_hec_<index> output; senders route to their index's output.
cribl_edge_per_index_indexes:
  - unifi
  - firewall
  - os
  - netmon
  - unifi_metrics
  # dns (Technitium query-log export, dns_query family), proxy (traefik/haproxy
  # program routes), honeypot (opencanary/tpot) — new syslog families landing
  # on this Edge; each needs its dedicated per-index HEC output.
  - dns
  - proxy
  - honeypot
  # otel: Splunk leg of the 4.12 OTel routes fan-out (routes.yml).
  - otel
  # hardware: host disk/health telemetry (SMART, ZFS/ZED, kernel disk I/O).
  # Not a syslog family of its own — populated by the syslog pipeline's
  # hardware reclassify (cribl_edge_hardware_match) diverting os-family lines,
  # plus the Cribl exec packs. Gets a dedicated splunk_hec_hardware output
  # whose token matches the standalone hardware index in ansible-splunk.
  - hardware

# The os decomposition targets need their own HEC outputs, exactly like
# hardware. Derived from cribl_edge_os_host_routing so the index list and the
# match rules cannot drift apart — adding a mapping above is the only edit
# needed to route a new slice out of the os catch-all.
cribl_edge_all_index_outputs: >-
  {{ cribl_edge_per_index_indexes + (cribl_edge_os_host_routing.keys() | list) }}

# netmon Telegraf HEC ingestion. The per-WAN probers (roles/netmon) push
# Splunk-HEC to this Edge on cribl_hec_input_port (group_vars/all.yml); the
# netmon pipeline stamps index=netmon_metrics and reuses the splunk_hec output above.
# Token is optional — empty accepts unauthenticated pushes from the mgmt VLAN.
cribl_edge_hec_input_port: "{{ cribl_hec_input_port | default(8088) }}"
cribl_edge_hec_input_token: "{{ lookup('env', 'NETMON_HEC_TOKEN') | default('', true) }}"

# =============================================================================
# OTLP/HTTP source for the LLM fabric (LiteLLM routers + orchestration apps
# emit OTel to this Edge) and its Langfuse destination. Port from tofu
# constants; project keys from Doppler env (pre-provisioned via the langfuse
# role's LANGFUSE_INIT_*). Rendering is gated on the keys being present, so a
# host without them keeps its existing pipeline untouched. Since 4.12 the
# otel input is fanned out via the routes table (routes.yml.j2): a non-final
# otel_langfuse route feeds Langfuse and a final otel_splunk route stamps
# index=otel for Splunk — routes CAN split one input across outputs now.
# =============================================================================
cribl_edge_otel_port: >-
  {{ hostvars['localhost']['tofu_data']['constants']['service_ports']['otel_traces_http'] }}
cribl_edge_langfuse_url: >-
  https://langfuse.{{ lookup('env', 'PROXMOX_SUBDOMAIN')
  | mandatory('PROXMOX_SUBDOMAIN required') }}/api/public/otel
cribl_edge_langfuse_public_key: "{{ lookup('env', 'LANGFUSE_PUBLIC_KEY') | default('', true) }}"
cribl_edge_langfuse_secret_key: "{{ lookup('env', 'LANGFUSE_SECRET_KEY') | default('', true) }}"
