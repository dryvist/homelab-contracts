---
# Resolve the published OpenTofu inventory and load it as `tofu_data`.
# Runs on localhost, read-only, and must work under --check (the fetch pair
# really runs: check_mode: false) — see defaults/main.yml for the contract.
#
# The two facts this role exports — `tofu_inventory_resolved` and `tofu_data`
# — are the cross-repo contract (consumed verbatim by every downstream role
# that reads tofu_data.*), so they intentionally keep their historical,
# un-prefixed names; the var-naming noqa on those two tasks is deliberate.

- name: Stat the explicit TOFU_INVENTORY_PATH
  ansible.builtin.stat:
    path: "{{ inventory_resolve_path }}"
  register: inventory_resolve_explicit_stat
  when: inventory_resolve_path | length > 0

- name: Resolve inventory from the explicit path when it exists
  ansible.builtin.set_fact: # noqa: var-naming[no-role-prefix] — contract fact
    tofu_inventory_resolved: "{{ inventory_resolve_path }}"
  when:
    - inventory_resolve_path | length > 0
    - inventory_resolve_explicit_stat.stat.exists | default(false)

# --- homelab RustFS, with credentials fetched natively from OpenBao ----------
- name: Resolve the published inventory from the on-prem store
  when:
    - tofu_inventory_resolved is not defined
    - inventory_resolve_openbao_addr | length > 0
    - inventory_resolve_openbao_token | length > 0
  block:
    - name: Read RustFS credentials from OpenBao
      community.hashi_vault.vault_kv2_get:
        url: "{{ inventory_resolve_openbao_addr }}"
        token: "{{ inventory_resolve_openbao_token }}"
        engine_mount_point: "{{ inventory_resolve_openbao_mount }}"
        path: "{{ inventory_resolve_openbao_path }}"
        validate_certs: "{{ inventory_resolve_openbao_validate_certs }}"
      register: inventory_resolve_object_storage
      failed_when: false
      no_log: true

    # failed_when: false is deliberate — a missing or unreadable secret should
    # fall through to the next source, not abort the play. But paired with
    # no_log it also discards WHY, and the terminal message below then names
    # OpenBao permissions as the thing to fix. That is a guess, and when it is
    # wrong it sends the reader to audit a policy that was correct all along.
    # (Real case: hvac absent from the interpreter, so the module died on
    # import; the AppRole read the path with HTTP 200 the whole time.)
    #
    # Keep the fall-through, keep the secret out of the log, carry the reason.
    #
    # The reason cannot come from the read itself. With no_log the registered
    # result keeps only changed/failed/failed_when_result/
    # failed_when_suppressed_exception — no msg, and the exception reads
    # "(traceback unavailable)". So `.msg` is always absent here and any
    # message built from it is a fixed string wearing a diagnosis.
    #
    # Ask the server something whose answer holds no secret instead, and only
    # when the read came back empty, so the happy path pays nothing for it.
    - name: Probe the credential store to find out why the read was empty
      ansible.builtin.uri:
        url: "{{ inventory_resolve_openbao_addr }}/v1/sys/health"
        method: GET
        # Sealed/standby/DR are all "reachable" for this purpose — the question
        # is whether the controller can talk to it at all, not its HA role.
        status_code: [200, 429, 472, 473, 501, 503]
        validate_certs: "{{ inventory_resolve_openbao_validate_certs }}"
        timeout: 10
      register: inventory_resolve_openbao_probe
      failed_when: false
      changed_when: false
      check_mode: false
      when: inventory_resolve_object_storage.secret is not defined

    - name: Note why the credential read returned nothing
      ansible.builtin.set_fact:
        inventory_resolve_openbao_error: >-
          {{ ('cannot reach ' ~ inventory_resolve_openbao_addr ~ ' — ' ~
              (inventory_resolve_openbao_probe.msg | default('no response')))
             if (inventory_resolve_openbao_probe.status | default(0)) <= 0
             else ('store answered HTTP ' ~
                   inventory_resolve_openbao_probe.status ~
                   ' — not connectivity. Check that the token may read the' ~
                   ' path, and that hvac is installed for the interpreter' ~
                   ' running this play.') }}
      when: inventory_resolve_object_storage.secret is not defined

    - name: Compute the effective on-prem object URI
      ansible.builtin.set_fact:
        inventory_resolve_s3_effective: >-
          {{ inventory_resolve_s3_uri
             if inventory_resolve_s3_uri | length > 0
             else inventory_resolve_onprem_default_uri }}

    - name: Create a temp file for the on-prem inventory
      ansible.builtin.tempfile:
        state: file
        suffix: tofu_inventory.json
      register: inventory_resolve_tmp
      changed_when: false
      check_mode: false
      when:
        - inventory_resolve_object_storage.secret.S3_ENDPOINT | default('') | length > 0
        - inventory_resolve_object_storage.secret.S3_ACCESS_KEY_ID | default('') | length > 0
        - inventory_resolve_object_storage.secret.S3_SECRET_ACCESS_KEY | default('') | length > 0

    - name: Download the inventory from the on-prem store
      amazon.aws.s3_object:
        bucket: "{{ inventory_resolve_s3_effective | regex_replace('^s3://([^/]+)/.*$', '\\1') }}"
        object: "{{ inventory_resolve_s3_effective | regex_replace('^s3://[^/]+/', '') }}"
        dest: "{{ inventory_resolve_tmp.path }}"
        mode: get
        endpoint_url: "{{ inventory_resolve_object_storage.secret.S3_ENDPOINT }}"
        access_key: "{{ inventory_resolve_object_storage.secret.S3_ACCESS_KEY_ID }}"
        secret_key: "{{ inventory_resolve_object_storage.secret.S3_SECRET_ACCESS_KEY }}"
        region: "{{ inventory_resolve_object_storage.secret.S3_REGION | default('us-east-1', true) }}"
      register: inventory_resolve_s3_get
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true
      when: inventory_resolve_tmp.path is defined

    # Same reasoning as the credential read above: the fall-through is wanted,
    # the silence is not. A store that is unreachable, a bucket policy that
    # denies, a renamed object — all currently look identical to "no creds".
    - name: Note why the download returned nothing
      ansible.builtin.set_fact:
        inventory_resolve_s3_error: >-
          {{ (inventory_resolve_s3_get.msg
              | default('the module reported no error'))
             | string | truncate(300, true) }}
      when:
        - inventory_resolve_tmp.path is defined
        - inventory_resolve_s3_get.failed | default(false)
          or (inventory_resolve_s3_get.msg is defined)

    - name: Stat the downloaded inventory
      ansible.builtin.stat:
        path: "{{ inventory_resolve_tmp.path }}"
      register: inventory_resolve_s3_stat
      when: inventory_resolve_tmp.path is defined

    - name: Resolve inventory from the on-prem download when it succeeded
      ansible.builtin.set_fact: # noqa: var-naming[no-role-prefix] — contract fact
        tofu_inventory_resolved: "{{ inventory_resolve_tmp.path }}"
      when: (inventory_resolve_s3_stat.stat.size | default(0)) > 0

# Composed separately from the failure message so the reason survives whether
# the credential read, the download, or both are what went wrong.
- name: Compose what actually went wrong
  ansible.builtin.set_fact:
    inventory_resolve_why: |
      {% if inventory_resolve_openbao_error is defined %}
        credential read ({{ inventory_resolve_openbao_mount }}/{{ inventory_resolve_openbao_path }}):
          {{ inventory_resolve_openbao_error }}
      {% elif inventory_resolve_openbao_addr | length == 0 or inventory_resolve_openbao_token | length == 0 %}
        credential read: skipped — BAO_ADDR and/or BAO_TOKEN not set in the environment.
      {% endif %}
      {%- if inventory_resolve_s3_error is defined %}
        object download ({{ inventory_resolve_s3_effective | default('(no URI)', true) }}):
          {{ inventory_resolve_s3_error }}
      {% endif %}
  when: tofu_inventory_resolved is not defined

- name: Fail when no inventory source resolves
  ansible.builtin.fail:
    msg: |
      OpenTofu inventory could not be resolved from any source:
        1. TOFU_INVENTORY_PATH : {{ inventory_resolve_path | default('(unset)', true) }}
        2. published artifact  : {{ inventory_resolve_s3_effective | default('(no store creds / URI)', true) }}

      What actually went wrong:
      {{ inventory_resolve_why | default('  (not determined)') }}
      Read that reason first. It is frequently a missing Python library on the
      controller (community.hashi_vault needs hvac, amazon.aws needs boto3), or
      the controller being unable to reach the credential store at all, rather
      than a permission — those fail on import or on connect and look nothing
      like an access error.

      Otherwise provide ONE of:
        - BAO_ADDR and BAO_TOKEN with read access to
          {{ inventory_resolve_openbao_mount }}/{{ inventory_resolve_openbao_path }}.
        - Optionally TOFU_INVENTORY_S3_URI for a non-default RustFS object.
        - TOFU_INVENTORY_PATH pointing at a local copy.
        - A successful Terrakube run so the native publish refreshes the artifact.
  when:
    - tofu_inventory_resolved is not defined
    - inventory_resolve_fail_when_unresolved | bool

- name: Load OpenTofu inventory JSON
  ansible.builtin.include_vars: # noqa: var-naming[no-role-prefix] — contract fact
    file: "{{ tofu_inventory_resolved }}"
    name: tofu_data
  when: tofu_inventory_resolved is defined

- name: Validate required top-level keys in tofu_data
  ansible.builtin.assert:
    that:
      - tofu_data is defined
      - item in tofu_data
    fail_msg: >-
      tofu_data.{{ item }} is missing from {{ tofu_inventory_resolved }} —
      re-run the producer Terrakube workspace so the inventory is republished.
  loop: "{{ inventory_resolve_required_keys }}"
  when: tofu_data is defined

# --- is an apply owed? ------------------------------------------------------
#
# The artifact just loaded is only as current as the last apply. A desired-state
# edit that was merged but never applied leaves this artifact silently
# contradicting desired state, and nothing downstream can tell: applying only
# re-renders the artifact, converging only consumes whatever the artifact
# currently says, so a converge in that state produces a confidently wrong
# result rather than an error.
#
# The producer stamps the desired-state object's ETag into the artifact it
# renders (tofu-proxmox inventory_publish.tf). Comparing that against the LIVE
# desired-state object answers the question exactly: equal means this artifact
# was built from the desired state that exists right now.
#
# WARN, never fail. This is a detector, and a detector that can block every
# converge in the estate is a worse outage than the drift it watches for. It
# also fails OPEN at every step — no store credentials, no fingerprint in the
# artifact, an unreadable desired-state object — because a check that cannot run
# must not be reported as a check that passed.
- name: Determine whether the artifact is current with desired state
  when:
    - tofu_data is defined
    - (tofu_data.desired_state | default({})).etag | default('') | length > 0
    # Undefined whenever the artifact came from TOFU_INVENTORY_PATH instead of
    # the store, which is exactly when there are no credentials to re-read with.
    - inventory_resolve_object_storage is defined
    - inventory_resolve_object_storage.secret.S3_ENDPOINT | default('') | length > 0
  block:
    - name: Read the live desired-state object's fingerprint
      amazon.aws.s3_object_info:
        bucket_name: "{{ inventory_resolve_desired_state_bucket }}"
        object_name: "{{ inventory_resolve_desired_state_key }}"
        endpoint_url: "{{ inventory_resolve_object_storage.secret.S3_ENDPOINT }}"
        access_key: "{{ inventory_resolve_object_storage.secret.S3_ACCESS_KEY_ID }}"
        secret_key: "{{ inventory_resolve_object_storage.secret.S3_SECRET_ACCESS_KEY }}"
        region: "{{ inventory_resolve_object_storage.secret.S3_REGION | default('us-east-1', true) }}"
      register: inventory_resolve_desired_state_info
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true

    # The two sides quote the ETag differently — the object store returns it
    # wrapped in double quotes, the producer's data source strips them — so a
    # raw comparison reports every artifact as stale. Normalise both.
    - name: Compare the published fingerprint against the live one
      ansible.builtin.set_fact: # noqa: var-naming[no-role-prefix] — contract fact
        tofu_desired_state_published: >-
          {{ (tofu_data.desired_state | default({})).etag
             | default('') | regex_replace('\"', '') }}
        tofu_desired_state_live: >-
          {{ (inventory_resolve_desired_state_info.object_info | default([]) | first
              | default({})).object_data.e_tag | default('') | regex_replace('\"', '') }}

    # Unknown (the live read returned nothing) is NOT stale. Reporting "apply
    # owed" because the detector could not read the object would train everyone
    # to ignore it.
    - name: Record whether an apply is owed
      ansible.builtin.set_fact: # noqa: var-naming[no-role-prefix] — contract fact
        tofu_desired_state_current: >-
          {{ tofu_desired_state_live | length == 0
             or tofu_desired_state_live == tofu_desired_state_published }}

    - name: Warn that an apply is owed before this converge
      ansible.builtin.debug:
        msg: >-
          APPLY OWED: the published inventory was rendered from desired state
          {{ tofu_desired_state_published }}, but desired state is now
          {{ tofu_desired_state_live }} (last modified
          {{ (tofu_data.desired_state | default({})).last_modified
             | default('unknown', true) }}).
          This converge will apply whatever the STALE artifact says. Run the
          producer workspace apply FIRST, then converge — the other order
          produces a confidently wrong result rather than an error.
      when: not (tofu_desired_state_current | bool)
