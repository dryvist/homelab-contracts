---
# Thin passthrough so a consumer can do
# `import_playbook: dryvist.homelab.converge_gate` at every stage boundary,
# while the real logic stays in ansible/roles/converge_gate -- testable the
# same way every other shared role in this collection is (see
# tests/inventory_resolve/*.yml): via include_role from a test playbook.
- name: Gate the converge on its wall-clock budget
  hosts: localhost
  gather_facts: false
  become: false
  tags:
    - always
  vars:
    ansible_become: false
  tasks:
    # include_role resolves the name at run time, so the role is found from the
    # source tree and from an installed copy of the collection alike. apply
    # keeps the role's tasks running under --tags.
    - name: Run the shared gate role
      ansible.builtin.include_role:
        name: converge_gate
        apply:
          tags:
            - always
