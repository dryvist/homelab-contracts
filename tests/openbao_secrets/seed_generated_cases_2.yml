---
# ---- guards -------------------------------------------------------------------

- name: Case H - a check-and-set conflict fails the run and leaves the secret unchanged
  block:
    - name: H - seed a secret that lacks one field
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/seed"
        method: POST
        body_format: json
        body: {path: secret/data/seed/cas, version: 1, data: {password: live}}
        status_code: [200]

    - name: H - arm one write failure
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/arm-write-failure"
        method: POST
        status_code: [200]

    - name: H - run, expecting the write to be refused
      block:
        - name: H - seeded run
          ansible.builtin.include_role:
            name: openbao_secrets
            tasks_from: seed_generated
          vars:
            openbao_secrets_seed_path: seed/cas
            openbao_secrets_seed_fields:
              - name: password
                length: 16
              - name: api_key
                length: 32
      rescue:
        - name: H - record that the run failed
          ansible.builtin.set_fact:
            case_h_failed: true

    - name: H - read the stand-in state
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/state"
        return_content: true
      register: state_h

    - name: H - assert the run failed and the stored value and version are unchanged
      ansible.builtin.assert:
        that:
          - case_h_failed | default(false) | bool
          - state_h.json.state['secret/data/seed/cas'].version == 1
          - state_h.json.state['secret/data/seed/cas'].data.password == 'live'
          - state_h.json.state['secret/data/seed/cas'].data | length == 1

- name: Case I - invalid arguments are refused before any request
  block:
    - name: I - reset the request log
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/log-reset"
        method: POST
        status_code: [200]

    - name: I - a missing path is refused by the argument spec
      block:
        - name: I1 - run without a path
          ansible.builtin.include_role:
            name: openbao_secrets
            tasks_from: seed_generated
          vars:
            openbao_secrets_seed_fields:
              - name: password
      rescue:
        - name: I1 - record the refusal
          ansible.builtin.set_fact:
            case_i1_failed: true

    - name: I - an unknown charset is refused by the argument spec
      block:
        - name: I2 - run with an unknown charset
          ansible.builtin.include_role:
            name: openbao_secrets
            tasks_from: seed_generated
          vars:
            openbao_secrets_seed_path: seed/invalid
            openbao_secrets_seed_fields:
              - name: password
                charset: base64
      rescue:
        - name: I2 - record the refusal
          ansible.builtin.set_fact:
            case_i2_failed: true

    - name: I - a rotate field that is not declared is refused before any request
      block:
        - name: I3 - run with an undeclared rotate field
          ansible.builtin.include_role:
            name: openbao_secrets
            tasks_from: seed_generated
          vars:
            openbao_secrets_seed_path: seed/invalid
            openbao_secrets_seed_rotate_fields: [other]
            openbao_secrets_seed_fields:
              - name: password
      rescue:
        - name: I3 - record the refusal
          ansible.builtin.set_fact:
            case_i3_failed: true

    - name: I - read the stand-in state
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/state"
        return_content: true
      register: state_i

    - name: I - assert all three were refused and nothing was sent
      ansible.builtin.assert:
        that:
          - case_i1_failed | default(false) | bool
          - case_i2_failed | default(false) | bool
          - case_i3_failed | default(false) | bool
          - state_i.json.log | length == 0

# ---- writer identity and capabilities --------------------------------------

- name: Case J - the writer identity check passes for the exact token and refuses extra policies
  block:
    - name: J - exact identity writes the field
      ansible.builtin.include_role:
        name: openbao_secrets
        tasks_from: seed_generated
      vars:
        openbao_secrets_seed_path: seed/identity-ok
        openbao_secrets_seed_expected_writer_policy: test-write
        openbao_secrets_seed_fields:
          - name: password
            length: 10

    - name: J - a token with an extra policy is refused before any request
      block:
        - name: J - run with the extra-policy token
          ansible.builtin.include_role:
            name: openbao_secrets
            tasks_from: seed_generated
          vars:
            openbao_secrets_seed_token: writer-extra-policy
            openbao_secrets_seed_path: seed/identity-bad
            openbao_secrets_seed_expected_writer_policy: test-write
            openbao_secrets_seed_fields:
              - name: password
                length: 10
      rescue:
        - name: J - record the refusal
          ansible.builtin.set_fact:
            case_j_failed: true

    - name: J - read the stand-in state
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/state"
        return_content: true
      register: state_j

    - name: J - assert the exact identity seeded and the extra-policy token did not
      ansible.builtin.assert:
        that:
          - state_j.json.state['secret/data/seed/identity-ok'].version == 1
          - "'secret/data/seed/identity-bad' not in state_j.json.state"
          - case_j_failed | default(false) | bool

- name: Case K - the capability check passes for the exact capabilities and refuses others
  block:
    - name: K - exact capabilities write the field
      ansible.builtin.include_role:
        name: openbao_secrets
        tasks_from: seed_generated
      vars:
        openbao_secrets_seed_path: seed/caps-ok
        openbao_secrets_seed_check_capabilities: true
        openbao_secrets_seed_fields:
          - name: password
            length: 10

    - name: K - wrong capabilities are refused before any request
      block:
        - name: K - run with the read-only token
          ansible.builtin.include_role:
            name: openbao_secrets
            tasks_from: seed_generated
          vars:
            openbao_secrets_seed_token: writer-caps-bad
            openbao_secrets_seed_path: seed/caps-bad
            openbao_secrets_seed_check_capabilities: true
            openbao_secrets_seed_fields:
              - name: password
                length: 10
      rescue:
        - name: K - record the refusal
          ansible.builtin.set_fact:
            case_k_failed: true

    - name: K - read the stand-in state
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/state"
        return_content: true
      register: state_k

    - name: K - assert the exact-capability run seeded and the other did not
      ansible.builtin.assert:
        that:
          - state_k.json.state['secret/data/seed/caps-ok'].version == 1
          - "'secret/data/seed/caps-bad' not in state_k.json.state"
          - case_k_failed | default(false) | bool

# ---- revocation and check mode ----------------------------------------------

- name: Case L - the writer token is revoked only when asked
  block:
    - name: L - reset the request log
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/log-reset"
        method: POST
        status_code: [200]

    - name: L - run with the default (no revocation)
      ansible.builtin.include_role:
        name: openbao_secrets
        tasks_from: seed_generated
      vars:
        openbao_secrets_seed_path: seed/revoke-default
        openbao_secrets_seed_fields:
          - name: password
            length: 8

    - name: L - run with revocation requested
      ansible.builtin.include_role:
        name: openbao_secrets
        tasks_from: seed_generated
      vars:
        openbao_secrets_seed_path: seed/revoke-on
        openbao_secrets_seed_revoke_token: true
        openbao_secrets_seed_fields:
          - name: password
            length: 8

    - name: L - read the stand-in state
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/state"
        return_content: true
      register: state_l

    - name: L - assert exactly one revocation, from the revoking run
      ansible.builtin.assert:
        that:
          - state_l.json.log | selectattr('path', 'equalto', '/v1/auth/token/revoke-self') | list | length == 1
          - state_l.json.state['secret/data/seed/revoke-on'].version == 1

- name: Case M - check mode reports and writes nothing
  block:
    - name: M - reset the request log
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/log-reset"
        method: POST
        status_code: [200]

    - name: M - run in check mode over an absent secret
      ansible.builtin.import_role:
        name: openbao_secrets
        tasks_from: seed_generated
      check_mode: true
      vars:
        openbao_secrets_seed_path: seed/checkmode
        openbao_secrets_seed_fields:
          - name: password
            length: 8

    - name: M - read the stand-in state
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/state"
        return_content: true
      register: state_m

    - name: M - assert nothing was created and no write was sent
      ansible.builtin.assert:
        that:
          - "'secret/data/seed/checkmode' not in state_m.json.state"
          - state_m.json.log | selectattr('method', 'equalto', 'POST') | list | length == 0
          - openbao_secrets_seed_result.password == '(placeholder in check mode)'

    - name: M - seed an existing secret for check mode
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/seed"
        method: POST
        body_format: json
        body: {path: secret/data/seed/checkmode-existing, version: 1, data: {password: keep-this}}
        status_code: [200]

    - name: M - reset the request log before the existing-value check
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/log-reset"
        method: POST
        status_code: [200]

    - name: M - run in check mode over an existing secret and a missing field
      ansible.builtin.import_role:
        name: openbao_secrets
        tasks_from: seed_generated
      check_mode: true
      vars:
        openbao_secrets_seed_path: seed/checkmode-existing
        openbao_secrets_seed_fields:
          - name: password
            length: 8
          - name: api_key
            length: 12

    - name: M - read the existing check-mode state
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/state"
        return_content: true
      register: state_m_existing

    - name: M - assert check mode returns the stored value and placeholder without writing
      ansible.builtin.assert:
        that:
          - openbao_secrets_seed_result.password == 'keep-this'
          - openbao_secrets_seed_result.api_key == '(placeholder in check mode)'
          - state_m_existing.json.state['secret/data/seed/checkmode-existing'].version == 1
          - state_m_existing.json.log | selectattr('method', 'equalto', 'POST') | list | length == 0

- name: Case N - local values are returned without contacting OpenBao when no endpoint is configured
  block:
    - name: N - reset the request log
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/log-reset"
        method: POST
        status_code: [200]

    - name: N - run with local values and no OpenBao endpoint
      ansible.builtin.include_role:
        name: openbao_secrets
        tasks_from: seed_generated
      vars:
        openbao_secrets_seed_addr: ""
        openbao_secrets_seed_token: ""
        openbao_secrets_seed_path: seed/local-fallback
        openbao_secrets_seed_register: local_seed_values
        openbao_secrets_seed_local_values:
          password: local-password
          unused: not-a-declared-field
        openbao_secrets_seed_fields:
          - name: password
            length: 8
          - name: api_key
            length: 12

    - name: N - read the stand-in state
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/state"
        return_content: true
      register: state_n

    - name: N - assert local values are filtered and no OpenBao request or write occurred
      ansible.builtin.assert:
        that:
          - "local_seed_values == {'password': 'local-password'}"
          - "'secret/data/seed/local-fallback' not in state_n.json.state"
          - state_n.json.log | length == 0

- name: Case O - local values are returned when the configured endpoint is not healthy
  block:
    - name: O - mark the endpoint unhealthy and reset the request log
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/health-status"
        method: POST
        body_format: json
        body: {status: 503}
        status_code: [200]

    - name: O - reset the request log
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/log-reset"
        method: POST
        status_code: [200]

    - name: O - run with local values while OpenBao is unavailable
      ansible.builtin.include_role:
        name: openbao_secrets
        tasks_from: seed_generated
      vars:
        openbao_secrets_seed_path: seed/unhealthy-fallback
        openbao_secrets_seed_register: unhealthy_seed_values
        openbao_secrets_seed_local_values:
          password: local-password
        openbao_secrets_seed_fields:
          - name: password
            length: 8

    - name: O - read the stand-in state
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/state"
        return_content: true
      register: state_o

    - name: O - assert only the health check was sent and no value was written
      ansible.builtin.assert:
        that:
          - "unhealthy_seed_values == {'password': 'local-password'}"
          - state_o.json.log | selectattr('path', 'equalto', '/v1/sys/health') | list | length == 1
          - state_o.json.log | selectattr('path', 'search', 'secret/data/') | list | length == 0
          - state_o.json.log | selectattr('method', 'equalto', 'POST') | list | length == 0
          - "'secret/data/seed/unhealthy-fallback' not in state_o.json.state"

    - name: O - restore a healthy endpoint
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/health-status"
        method: POST
        body_format: json
        body: {status: 200}
        status_code: [200]

- name: Case P - a KV authorization denial does not select local fallback values
  block:
    - name: P - reset the request log
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/log-reset"
        method: POST
        status_code: [200]

    - name: P - run with a bad writer token and a local fallback, expecting refusal
      block:
        - name: P - seed call with denied credentials
          ansible.builtin.include_role:
            name: openbao_secrets
            tasks_from: seed_generated
          vars:
            openbao_secrets_seed_token: invalid-writer
            openbao_secrets_seed_path: seed/denied
            openbao_secrets_seed_register: case_p_result
            openbao_secrets_seed_local_values:
              password: must-not-fallback
            openbao_secrets_seed_fields:
              - name: password
      rescue:
        - name: P - record the denied result
          ansible.builtin.set_fact:
            case_p_failed: true

    - name: P - read the stand-in state
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/state"
        return_content: true
      register: state_p

    - name: P - assert denial failed and did not publish a fallback
      ansible.builtin.assert:
        that:
          - case_p_failed | default(false) | bool
          - case_p_result is not defined
          - state_p.json.log | selectattr('path', 'equalto', '/v1/sys/health') | list | length == 1
          - state_p.json.log | selectattr('path', 'equalto', '/v1/secret/data/seed/denied') | list | length == 1
          - state_p.json.log | selectattr('method', 'equalto', 'POST') | list | length == 0

- name: Case Q - the empty default fallback keeps OpenBao required
  block:
    - name: Q - reset the request log
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/log-reset"
        method: POST
        status_code: [200]

    - name: Q - run without an endpoint or local values, expecting refusal
      block:
        - name: Q - seed call without either source
          ansible.builtin.include_role:
            name: openbao_secrets
            tasks_from: seed_generated
          vars:
            openbao_secrets_seed_addr: ""
            openbao_secrets_seed_token: ""
            openbao_secrets_seed_path: seed/no-source
            openbao_secrets_seed_local_values: {}
            openbao_secrets_seed_fields:
              - name: password
      rescue:
        - name: Q - record the missing-source refusal
          ansible.builtin.set_fact:
            case_q_failed: true

    - name: Q - read the stand-in state
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/state"
        return_content: true
      register: state_q

    - name: Q - assert no source fails without contacting OpenBao
      ansible.builtin.assert:
        that:
          - case_q_failed | default(false) | bool
          - state_q.json.log | length == 0

- name: Case R - a failed revocation is reported without the token, after the write
  block:
    - name: R - run with a token whose revocation fails
      block:
        - name: R - seed with revocation requested
          ansible.builtin.include_role:
            name: openbao_secrets
            tasks_from: seed_generated
          vars:
            openbao_secrets_seed_path: seed/revoke-fails
            openbao_secrets_seed_token: writer-revoke-fails
            openbao_secrets_seed_revoke_token: true
            openbao_secrets_seed_fields:
              - name: password
                length: 8
      rescue:
        - name: R - record the reported failure
          ansible.builtin.set_fact:
            case_r_msg: "{{ ansible_failed_result.msg | default('') }}"

    - name: R - read the stand-in state
      ansible.builtin.uri:
        url: "{{ fake_addr }}/_test/state"
        return_content: true
      register: state_r

    - name: R - assert the write landed and the message names the TTL, not the token
      ansible.builtin.assert:
        that:
          - case_r_msg is search('self-revocation failed \\(HTTP 500\\)')
          - case_r_msg is search('until its TTL expires')
          - "'writer-revoke-fails' not in case_r_msg"
          - state_r.json.state['secret/data/seed/revoke-fails'].version == 1
