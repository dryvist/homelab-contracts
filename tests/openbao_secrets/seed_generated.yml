---
# Behavioural checks for tasks/seed_generated.yml against the local KV v2 stand-in
# (tests/openbao_secrets/fake_kv2.py). Each case uses its own secret path, so the
# stand-in keeps state across cases without a reset.
#
# Run from the repository root:
#   ANSIBLE_ROLES_PATH=ansible/roles ansible-playbook -i localhost, tests/openbao_secrets/seed_generated.yml
- name: Verify seed_generated create, merge, rotate, provided-value and guard behaviour
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    fake_port: 18232
    fake_addr: "http://127.0.0.1:{{ fake_port }}"
    openbao_secrets_seed_addr: "{{ fake_addr }}"
    openbao_secrets_seed_token: writer-ok
    openbao_secrets_seed_mount: secret
  tasks:
    - name: Require the fake OpenBao test port to be free
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ fake_port }}"
        state: stopped
        timeout: 1
      changed_when: false

    - name: Run the seed-generated test cases
      block:
        - name: Start the KV v2 stand-in
          ansible.builtin.command: "python3 {{ playbook_dir }}/fake_kv2.py --port {{ fake_port }}"
          async: 900
          poll: 0
          changed_when: false

        - name: Mark the KV v2 stand-in as started
          ansible.builtin.set_fact:
            openbao_seed_fake_server_started: true

        - name: Wait for the stand-in to listen
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: "{{ fake_port }}"
            timeout: 30
          changed_when: false

        - name: Run the seed-generated scenarios
          ansible.builtin.import_tasks: seed_generated_cases.yml
      always:
        - name: Stop the KV v2 stand-in
          ansible.builtin.uri:
            url: "{{ fake_addr }}/_test/shutdown"
            method: POST
            status_code: [200]
            timeout: 5
          when: openbao_seed_fake_server_started | default(false) | bool
          changed_when: false
        - name: Wait for the stand-in to stop
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: "{{ fake_port }}"
            state: stopped
            timeout: 10
            connect_timeout: 1
          when: openbao_seed_fake_server_started | default(false) | bool
          changed_when: false
