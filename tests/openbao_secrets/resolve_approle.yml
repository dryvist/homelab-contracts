---
# Resolution order for a domain's AppRole pair (openbao_secrets
# tasks/resolve_approle.yml): SECRET_STORE_<DOMAIN>_* first, then
# OPENBAO_APPROLE_<DOMAIN>_*, then the legacy role_id_env/secret_id_env pair,
# else empty (the domain is skipped). The shared address and publish pair read
# their generic SECRET_STORE_* name first, then the older name.
#
# Run (the env lookup reads the controller's own environment):
#   SECRET_STORE_MONITORING_ROLE_ID=generic-role SECRET_STORE_MONITORING_SECRET_ID=generic-secret \
#   OPENBAO_APPROLE_MONITORING_ROLE_ID=new-mon-role OPENBAO_APPROLE_MONITORING_SECRET_ID=new-mon-secret \
#   OPENBAO_APPROLE_LOCAL_CLOUD_ROLE_ID=new-role OPENBAO_APPROLE_LOCAL_CLOUD_SECRET_ID=new-secret \
#   LOCAL_CLOUD_VAULT_ROLE_ID=legacy-role LOCAL_CLOUD_VAULT_SECRET_ID=legacy-secret \
#   APPS_VAULT_ROLE_ID=legacy-apps-role APPS_VAULT_SECRET_ID=legacy-apps-secret \
#   SECRET_STORE_ADDR=https://generic.test BAO_ADDR=https://legacy.test \
#   OPENBAO_APPROLE_ANSIBLE_ROLE_ID=legacy-publish-role OPENBAO_APPROLE_ANSIBLE_SECRET_ID=legacy-publish-secret \
#   ANSIBLE_ROLES_PATH=ansible/roles ansible-playbook -i localhost, \
#     tests/openbao_secrets/resolve_approle.yml

- name: Domain AppRole pairs resolve new name first, then legacy
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../ansible/roles/openbao_secrets/defaults/main.yml
  vars:
    expected:
      monitoring: [generic-role, generic-secret]
      local-cloud: [new-role, new-secret]
      apps: [legacy-apps-role, legacy-apps-secret]
      media: ["", ""]
  tasks:
    - name: Shared inputs read the generic name first, then the older one
      ansible.builtin.assert:
        that:
          - openbao_secrets_bao_addr == 'https://generic.test'
          - openbao_secrets_publish_role_id == 'legacy-publish-role'
          - openbao_secrets_publish_secret_id == 'legacy-publish-secret'
          - openbao_secrets_kv_mount == 'secret'

    - name: Resolve and check each case
      ansible.builtin.include_tasks: resolve_one.yml
      loop: "{{ expected | dict2items }}"
      loop_control:
        loop_var: case
