---
# Contract for the llm_roles role: the shipped map's cross-references resolve,
# and a map with a role pointing at an unknown model is rejected.
# Schema-level rules (dense => concurrency 1, host class keys) are exercised by
# the check-jsonschema steps in .github/workflows/ci.yml.
#
# Run: ANSIBLE_ROLES_PATH=ansible/roles ansible-playbook -i localhost, \
#        tests/llm_roles/test_contract.yml

- name: LLM role map contract
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Load the shipped map
      ansible.builtin.include_role:
        name: llm_roles
        public: true

    - name: Load the shared model catalog
      ansible.builtin.include_role:
        name: llm_model_catalog
        public: true

    - name: The shipped map resolves
      ansible.builtin.include_tasks: check_refs.yml
      vars:
        map: "{{ llm_roles }}"

    - name: Map model concurrency is projected from the shared catalog
      ansible.builtin.assert:
        that:
          - >-
            item.value.id in
            (llm_model_catalog_models | map(attribute='name') | list)
          - >-
            item.value.concurrency
            == (llm_model_catalog_models
                | selectattr('name', 'equalto', item.value.id)
                | map(attribute='max_parallel_requests') | first)
        fail_msg: >-
          {{ item.key }} concurrency must be projected from its catalog
          max_parallel_requests value.
        quiet: true
      loop: "{{ llm_roles.models | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: The judge role allows estate egress and no cloud egress
      ansible.builtin.assert:
        that: llm_roles.roles.judge.egress == 'estate'

    - name: The embedding role stays unbound until consumers route task types
      ansible.builtin.assert:
        that: llm_roles.roles.embed.model is none
        fail_msg: >-
          The generic model-role map must not route embeddings through chat
          serving.

    - name: Stage 0 semantic model IDs resolve through the catalog
      ansible.builtin.assert:
        that:
          - >-
            llm_roles.models.stage0_embedding.id
            == 'nativ-community/embeddinggemma-2-mxfp8'
          - >-
            llm_roles.models.stage0_systemone_opendecider.id
            == 'manjunathshiva/opendecider-nano'
          - >-
            llm_roles.models.stage0_systemone_laya.id
            == 'convaiinnovations/laya-typed-decisions'
          - >-
            llm_roles.roles.stage0_embedding.model == 'stage0_embedding'
          - >-
            llm_roles.roles.stage0_systemone_opendecider.model
            == 'stage0_systemone_opendecider'
          - >-
            llm_roles.roles.stage0_systemone_laya.model
            == 'stage0_systemone_laya'
          - llm_roles.roles.stage0_embedding.egress == 'none'
          - >-
            llm_roles.roles.stage0_systemone_opendecider.egress == 'none'
          - llm_roles.roles.stage0_systemone_laya.egress == 'none'
          - llm_roles.models.stage0_embedding.concurrency == 4
          - llm_roles.models.stage0_systemone_opendecider.concurrency == 4
          - llm_roles.models.stage0_systemone_laya.concurrency == 4
        fail_msg: >-
          Stage 0 semantic model-role IDs must resolve to their catalog entry
          and admission cap.

    - name: Stage 0 models stay on demand for both Mac host classes
      ansible.builtin.assert:
        that:
          - "'stage0_embedding' in llm_roles.hosts.workstation.swap"
          - "'stage0_systemone_opendecider' in llm_roles.hosts.workstation.swap"
          - "'stage0_systemone_laya' in llm_roles.hosts.workstation.swap"
          - "'stage0_embedding' in llm_roles.hosts.server.swap"
          - "'stage0_systemone_opendecider' in llm_roles.hosts.server.swap"
          - "'stage0_systemone_laya' in llm_roles.hosts.server.swap"
          - "'stage0_embedding' not in llm_roles.hosts.workstation.resident"
          - >-
            'stage0_systemone_opendecider' not in
            llm_roles.hosts.workstation.resident
          - >-
            'stage0_systemone_laya' not in
            llm_roles.hosts.workstation.resident
          - "'stage0_embedding' not in llm_roles.hosts.server.resident"
          - >-
            'stage0_systemone_opendecider' not in
            llm_roles.hosts.server.resident
          - "'stage0_systemone_laya' not in llm_roles.hosts.server.resident"
        fail_msg: >-
          Stage 0 models must remain in the on-demand swap set for each Mac
          host class, not in the always-resident set.

    - name: Negative - a role pointing at an unknown model must fail the check
      vars:
        map: >-
          {{ lookup('ansible.builtin.file', 'bad-unknown-model.json')
             | from_json }}
      block:
        - name: Run the check against the bad map
          ansible.builtin.include_tasks: check_refs.yml
        - name: The bad map was accepted
          ansible.builtin.fail:
            msg: check_refs.yml accepted a role pointing at an unknown model.
      rescue:
        - name: Distinguish the expected rejection from the sentinel failure
          ansible.builtin.assert:
            that: >-
              'accepted a role' not in ansible_failed_result.msg
              | default('')
