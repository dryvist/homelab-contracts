---
# Run: ANSIBLE_ROLES_PATH=ansible/roles ansible-playbook -i localhost, \
#        tests/llm_router_key_catalog/test_contract.yml
- name: Shared router key catalog contract
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Load the catalog
      ansible.builtin.include_role:
        name: llm_router_key_catalog
        public: true

    - name: The benchmark field is declared
      ansible.builtin.assert:
        that:
          - llm_router_key_catalog_facts.llm_router_key_catalog_source.benchmark_field == 'benchmark_llm_router_key'
          - llm_router_key_catalog_facts.openbao_router_key_catalog.keys() | list == ['benchmark']
          - llm_router_key_catalog_facts.openbao_router_key_catalog.benchmark == ['benchmark_llm_router_key']
          - llm_router_key_catalog_facts.program_key_definitions is not defined
          - llm_router_key_catalog_facts.program_key_catalog is not defined

    - name: No program key projections are published
      ansible.builtin.assert:
        that:
          - llm_router_key_catalog_facts.openbao_router_key_catalog.benchmark | length == 1
          - llm_router_key_catalog_facts.openbao_router_key_catalog.benchmark[0] == 'benchmark_llm_router_key'
